<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AtollLIS — Laboratory Information System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+Thaana:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="login-screen" id="loginScreen"></div>
<div id="app">
  <header class="topbar" id="topbar">
    <button class="menu-btn" onclick="openSidebar()" aria-label="Open menu">☰</button>
    <div class="brand">
      <div class="mark">Atoll<span>LIS</span></div>
      <div id="topbarFacility"></div>
    </div>
    <form class="scanbar" id="scanbar" onsubmit="event.preventDefault();submitScan();" role="search">
      <input id="scanField" autocomplete="off" spellcheck="false" placeholder="Scan or type a memo, specimen or hospital number (F2)" aria-label="Scan or type a memo, specimen or hospital number">
    </form>
    <div id="topbarUser"></div>
  </header>
  <div class="shell">
    <nav id="nav" class="rail" aria-label="Sections"></nav>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
    <main>
      <div class="content" id="content"></div>
    </main>
  </div>
</div>
<div id="modalRoot"></div>
<div id="confirmRoot"></div>
<div id="toastRoot"></div>

<!-- Plain scripts sharing one global scope, loaded in this order; see CLAUDE.md. -->
<script src="js/core.js"></script>
<script src="js/login.js"></script>
<script src="js/shell.js"></script>
<script src="js/home.js"></script>
<script src="js/collection.js"></script>
<script src="js/acceptance.js"></script>
<script src="js/processing.js"></script>
<script src="js/result-review.js"></script>
<script src="js/reports.js"></script>
<script src="js/patients.js"></script>
<script src="js/settings.js"></script>
<script src="js/catalog.js"></script>
<script src="js/init.js"></script>
</body>
</html>
