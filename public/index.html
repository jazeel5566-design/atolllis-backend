<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AtollLIS — Laboratory Information System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>

  :root{
    --navy:#0B2545; --navy-2:#122F55; --slate:#13315C;
    --teal:#1B998B; --teal-dark:#12766B; --teal-bg:#E5F5F3;
    --amber:#B4720A; --amber-bg:#FCF0DA;
    --crimson:#B0272D; --crimson-bg:#FBE7E7;
    --purple:#5B3FA6; --purple-bg:#EFE9FB;
    --bg:#F4F6F9; --card:#FFFFFF; --border:#DEE4EC;
    --text:#1F2933; --mute:#5A6B7B;
    --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--text);font-size:14px;}
  #app{display:none;min-height:100vh;flex-direction:column;}
  #app.show{display:flex;}
  .login-screen{display:none;min-height:100vh;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%,var(--navy-2),var(--navy));padding:20px;}
  .login-screen.show{display:flex;}
  .login-card{background:#fff;border-radius:16px;padding:32px 28px;width:100%;max-width:380px;box-shadow:0 24px 60px rgba(0,0,0,.35);}
  .topbar{background:linear-gradient(180deg,var(--navy),var(--navy-2));color:#fff;display:flex;align-items:center;gap:22px;padding:10px 22px;position:sticky;top:0;z-index:50;}
  .brand{display:flex;flex-direction:column;align-items:flex-start;gap:1px;flex-shrink:0;}
  .brand .mark{font-family:var(--mono);font-weight:600;font-size:17px;letter-spacing:.5px;white-space:nowrap;}
  .brand .mark span{color:#6FD8C7;}
  .brand .sub{display:none;}
  .topbar-main{display:flex;align-items:center;gap:22px;flex:1;min-width:0;}
  #topbarFacility .facility-name{font-size:12px;font-weight:600;color:#fff;white-space:nowrap;}
  nav{display:flex;align-items:center;gap:2px;flex:1;min-width:0;overflow-x:auto;}
  nav button{white-space:nowrap;background:none;border:none;color:#C9D6E8;padding:9px 12px;border-radius:7px 7px 0 0;font-size:13px;font-family:var(--sans);cursor:pointer;display:flex;align-items:center;gap:7px;border-bottom:2px solid transparent;flex-shrink:0;}
  nav button:hover{background:rgba(255,255,255,.08);color:#fff;}
  nav button.active{background:rgba(111,216,199,.13);color:#fff;border-bottom:2px solid #6FD8C7;font-weight:500;}
  nav .navicon{font-size:12px;opacity:.85;}
  #topbarUser{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  #topbarUser .user-name{font-size:12px;font-weight:600;color:#fff;white-space:nowrap;}
  #topbarUser .user-role{font-size:10.5px;color:#9FB0C8;white-space:nowrap;}
  #topbarUser .btn-logout{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.3);white-space:nowrap;padding:7px 12px;}
  #topbarUser .btn-logout:hover{background:rgba(255,255,255,.08);}
  .tier-badge{font-family:var(--mono);font-size:10.5px;padding:3px 8px;border-radius:5px;text-transform:uppercase;letter-spacing:.4px;font-weight:600;}
  .tier-health_centre{background:var(--teal-bg);color:var(--teal-dark);}
  .tier-atoll{background:var(--amber-bg);color:var(--amber);}
  .tier-regional{background:var(--purple-bg);color:var(--purple);}
  main{flex:1;min-width:0;}
  .content{padding:24px 22px 60px;width:100%;}
  h1{font-size:20px;margin:0 0 4px;font-weight:600;}
  h2{font-size:15px;margin:0 0 12px;font-weight:600;}
  .pagehead{margin-bottom:20px;}
  .pagehead p{margin:2px 0 0;color:var(--mute);font-size:13px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-bottom:16px;}
  .grid{display:grid;gap:14px;}
  .grid-2{grid-template-columns:1fr 1fr;}
  .grid-3{grid-template-columns:1fr 1fr 1fr;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  @media(max-width:820px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}
  label{display:block;font-size:12px;font-weight:500;color:var(--mute);margin-bottom:5px;}
  input,select,textarea{width:100%;font-family:var(--sans);font-size:13.5px;padding:9px 10px;border:1px solid var(--border);border-radius:7px;background:#fff;color:var(--text);}
  input[type="checkbox"],input[type="radio"]{width:16px;height:16px;padding:0;flex:0 0 auto;margin-top:2px;}
  input:focus,select:focus,textarea:focus{outline:2px solid #6FD8C7;outline-offset:0;border-color:#6FD8C7;}
  textarea{resize:vertical;min-height:60px;font-family:var(--sans);}
  .field{margin-bottom:12px;}
  .btn{font-family:var(--sans);font-size:13px;font-weight:500;padding:9px 15px;border-radius:7px;border:1px solid var(--navy);background:var(--navy);color:#fff;cursor:pointer;}
  .btn:hover{background:var(--navy-2);}
  .btn-outline{background:#fff;color:var(--navy);border:1px solid var(--border);}
  .btn-outline:hover{border-color:var(--navy);}
  .btn-teal{background:var(--teal);border-color:var(--teal);}
  .btn-teal:hover{background:var(--teal-dark);}
  .btn-danger{background:#fff;color:var(--crimson);border:1px solid var(--crimson-bg);}
  .btn-danger:hover{background:var(--crimson-bg);}
  .btn-sm{padding:7px 11px;font-size:12.5px;border-radius:6px;}
  .btn:focus-visible,.tab:focus-visible,nav button:focus-visible,[role="button"]:focus-visible,.modal-close:focus-visible{outline:3px solid #6FD8C7;outline-offset:2px;}
  .btn:active{transform:translateY(1px);}
  .btn[disabled]{opacity:.45;cursor:not-allowed;}
  table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums;}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--mute);padding:8px 10px;border-bottom:1px solid var(--border);font-weight:600;}
  td{padding:11px 10px;border-bottom:1px solid #EEF1F5;vertical-align:middle;}
  tbody tr:hover td{background:#F7F9FB;}
  td.num,th.num{text-align:right;}
  tr:last-child td{border-bottom:none;}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums;}
  .muted{color:var(--mute);}
  .pill{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:100px;letter-spacing:.2px;white-space:nowrap;}
  .pill-grey{background:#EDF0F4;color:#5A6B7B;}
  .pill-amber{background:var(--amber-bg);color:var(--amber);}
  .pill-teal{background:var(--teal-bg);color:var(--teal-dark);}
  .pill-purple{background:var(--purple-bg);color:var(--purple);}
  .pill-crimson{background:var(--crimson-bg);color:var(--crimson);}
  .empty{padding:34px 20px;text-align:center;color:var(--mute);}
  .empty .big{font-size:28px;margin-bottom:6px;}
  .modal-overlay{position:fixed;inset:0;background:rgba(11,37,69,.5);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:50;}
  .modal{background:#fff;border-radius:14px;max-width:660px;width:100%;padding:22px 24px;box-shadow:0 20px 50px rgba(0,0,0,.25);}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .modal-head h2{margin:0;}
  .modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--mute);}
  .range-row{display:grid;grid-template-columns:1fr 64px 64px 92px 80px 80px 30px;gap:6px;margin-bottom:6px;align-items:center;}
  .range-row input,.range-row select{padding:6px 7px;font-size:12.5px;}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:8px;font-size:13.5px;z-index:120;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:min(640px,92vw);display:flex;gap:14px;align-items:flex-start;}
  .toast-error{background:var(--crimson);}
  .toast-close{background:none;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:5px;font-size:12px;padding:3px 9px;cursor:pointer;font-family:var(--sans);flex-shrink:0;}
  #confirmRoot .modal-overlay{z-index:110;}
  .patient-bar{position:sticky;top:52px;z-index:5;background:var(--navy);color:#fff;border-radius:9px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
  .patient-bar .who{font-weight:600;font-size:15px;}
  .patient-bar .ids{font-size:12.5px;color:#D5DFEE;margin-top:2px;}
  .modal .patient-bar{top:0;margin-bottom:14px;}
  .sir{display:inline-flex;border:1px solid var(--border);border-radius:7px;overflow:hidden;}
  .sir button{font-family:var(--mono);font-size:13px;font-weight:600;width:38px;height:32px;border:none;border-left:1px solid var(--border);background:#fff;color:var(--mute);cursor:pointer;}
  .sir button:first-child{border-left:none;}
  .sir button.on{background:var(--navy);color:#fff;}
  .sir:focus-visible{outline:3px solid #6FD8C7;outline-offset:2px;}
  .stat-row{border-left:4px solid var(--crimson);padding-left:10px !important;}
  .wait{font-size:12px;color:var(--mute);white-space:nowrap;}
  .wait.late{color:var(--crimson);font-weight:700;}
  .live-flag{font-size:12px;margin-left:6px;}
  #content.busy{opacity:.6;transition:opacity .15s ease-out;}
  @media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important;}}
  .stepper{display:flex;align-items:center;margin:10px 0 4px;}
  .flow-track{display:flex;align-items:stretch;gap:0;flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;}
  .flow-step{flex:1 1 160px;min-width:150px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 14px;cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s;position:relative;}
  .flow-step:hover{border-color:var(--teal);box-shadow:0 6px 18px rgba(11,37,69,.08);transform:translateY(-2px);}
  .flow-num{width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;font-family:var(--mono);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;margin-bottom:8px;}
  .flow-icon{font-size:20px;margin-bottom:4px;}
  .flow-title{font-weight:600;font-size:13.5px;margin-bottom:3px;}
  .flow-desc{font-size:11.5px;color:var(--mute);line-height:1.4;min-height:32px;}
  .flow-badge{margin-top:8px;}
  .flow-arrow{display:flex;align-items:center;justify-content:center;padding:0 6px;color:var(--mute);font-size:18px;flex:0 0 auto;}
  @media(max-width:860px){
    .flow-track{flex-direction:column;overflow-x:visible;}
    .flow-arrow{transform:rotate(90deg);padding:2px 0;}
    .flow-step{min-width:0;}
  }
  .step{display:flex;flex-direction:column;align-items:center;flex:1;position:relative;}
  .step .dot{width:11px;height:11px;border-radius:50%;background:#DEE4EC;z-index:1;}
  .step.done .dot{background:var(--teal);}
  .step.now .dot{background:var(--navy);box-shadow:0 0 0 3px #DCE4F5;}
  .step .lbl{font-size:10px;color:var(--mute);margin-top:5px;text-align:center;max-width:80px;}
  .step:not(:last-child)::after{content:'';position:absolute;top:5px;left:55%;width:100%;height:2px;background:#DEE4EC;z-index:0;}
  .step.done:not(:last-child)::after{background:var(--teal);}
  .order-card{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:12px;}
  .order-card-head{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;margin-bottom:6px;}
  .order-id{font-family:var(--mono);font-weight:600;font-size:13px;}
  .test-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px dashed #EAEEF3;gap:10px;flex-wrap:wrap;}
  .test-row:first-of-type{border-top:none;}
  .test-name{font-weight:500;}
  .test-meta{font-size:11.5px;color:var(--mute);}
  .result-input{width:90px;display:inline-block;}
  .flag-High{color:var(--crimson);font-weight:700;}
  .flag-Low{color:var(--amber);font-weight:700;}
  .flag-High::before{content:"▲ ";}
  .flag-Low::before{content:"▼ ";}
  .flag-Normal{color:var(--teal-dark);font-weight:600;}
  .flag-CriticalHigh,.flag-CriticalLow{background:var(--crimson);color:#fff;font-weight:800;padding:2px 8px;border-radius:5px;letter-spacing:.3px;}
  .flag-CriticalHigh::before,.flag-CriticalLow::before{content:"⚠ ";}
  .actions-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px;border-bottom:1px solid var(--border);}
  .subtabs{display:flex;gap:6px;flex-wrap:wrap;margin:-6px 0 16px;}
  .subtab{padding:6px 12px;font-size:12.5px;font-weight:500;color:var(--mute);cursor:pointer;border:1px solid var(--border);border-radius:100px;background:#fff;}
  .subtab.active{color:#fff;background:var(--navy);border-color:var(--navy);}
  .tab{padding:9px 14px;font-size:13px;font-weight:500;color:var(--mute);cursor:pointer;border-bottom:2px solid transparent;}
  .tab.active{color:var(--navy);border-bottom-color:var(--navy);}
  .checklist{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:10px;}
  .check-item{display:flex;align-items:flex-start;gap:8px;padding:6px 8px;border-radius:6px;}
  .check-item span{flex:1;min-width:0;}
  .check-item:hover{background:#F7F9FB;}
  .cat-label{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--mute);font-weight:600;margin:10px 0 2px;}
  .kpi{display:flex;flex-direction:column;gap:2px;}
  .kpi .n{font-size:26px;font-weight:700;font-family:var(--mono);}
  .kpi .l{font-size:12px;color:var(--mute);}
  @media print{
    body *{visibility:hidden;}
    #labelPrintArea, #labelPrintArea *{visibility:visible;}
    #labelPrintArea{position:fixed;top:0;left:0;width:320px;}
    html,body{background:#fff !important;}
    .print-label{page-break-after:always;}
    .print-label:last-child{page-break-after:auto;}
    .btn,.no-print{display:none !important;}
  }

  /* ===== Mobile layout ===== */
  .menu-btn{display:none;background:none;border:1px solid rgba(255,255,255,.3);border-radius:7px;width:36px;height:36px;font-size:16px;color:#fff;cursor:pointer;flex-shrink:0;}
  .sidebar-overlay{display:none;}
  @media(max-width:860px){
    body{font-size:14.5px;}
    .menu-btn{display:inline-flex;align-items:center;justify-content:center;order:3;margin-left:auto;}
    .topbar-main{position:fixed;top:56px;left:0;right:0;bottom:0;background:linear-gradient(180deg,var(--navy),var(--navy-2));flex-direction:column;align-items:stretch;gap:0;padding:14px;overflow-y:auto;transform:translateY(-8px);opacity:0;visibility:hidden;transition:transform .18s ease,opacity .18s ease,visibility .18s;z-index:60;}
    .topbar-main.open{transform:translateY(0);opacity:1;visibility:visible;}
    nav{flex-direction:column;align-items:stretch;overflow-x:visible;}
    nav button{border-radius:8px;border-bottom:none;border-left:3px solid transparent;margin-bottom:2px;}
    nav button.active{border-bottom:none;border-left:3px solid #6FD8C7;}
    #topbarUser{flex-direction:column;align-items:stretch;margin-top:10px;padding-top:12px;border-top:1px solid rgba(255,255,255,.12);}
    #topbarUser .btn-logout{width:100%;}
    .sidebar-overlay.open{display:block;position:fixed;inset:0;background:rgba(11,37,69,.45);z-index:55;}
    .content{padding:16px 14px 50px;}
    .grid-2,.grid-3,.grid-4{grid-template-columns:1fr !important;}
    table{font-size:12.5px;}
    th,td{padding:7px 6px;}
    .modal{padding:18px 16px;max-width:100%;}
    .modal-overlay{padding:0;align-items:stretch;}
    .modal{border-radius:0;min-height:100vh;}
    .range-row{grid-template-columns:1fr 1fr;gap:6px;}
    .range-row > *:nth-child(7){justify-self:end;}
    .order-card-head{flex-direction:column;align-items:flex-start;}
    .test-row{flex-direction:column;align-items:flex-start;}
    .result-input{width:100%;margin-bottom:6px;}
    .actions-row .btn{flex:1 1 auto;text-align:center;}
    .btn,.btn-sm,.tab,.subtab{min-height:44px;}
    .patient-bar{top:56px;}
  }
</style>
</head>
<body>
<div class="login-screen" id="loginScreen"></div>
<div id="app">
  <header class="topbar" id="topbar">
    <div class="brand">
      <div class="mark">Atoll<span>LIS</span></div>
      <div id="topbarFacility"></div>
    </div>
    <div class="topbar-main" id="topbarMain">
      <nav id="nav"></nav>
      <div id="topbarUser"></div>
    </div>
    <button class="menu-btn" onclick="openSidebar()" aria-label="Open menu">☰</button>
  </header>
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
  <main>
    <div class="content" id="content"></div>
  </main>
</div>
<div id="modalRoot"></div>
<div id="confirmRoot"></div>
<div id="toastRoot"></div>

<script>
/* ============================= CONSTANTS ============================= */
// When this page is served BY the backend itself (the recommended combined-deployment setup),
// the API lives at the same origin, so no configuration is needed at all. When the file is opened
// directly (file://) for local dev against a separately-running backend, fall back to localhost.
const DEFAULT_API_BASE = (location.protocol === 'file:')
  ? 'http://localhost:4000/api'
  : (location.origin + '/api');
const TIER_SHORT = {health_centre:'Health Centre', atoll:'Atoll Hospital', regional:'Regional Hospital'};
const TIER_CLASS = {health_centre:'tier-health_centre', atoll:'tier-atoll', regional:'tier-regional'};
const ROLE_LABELS = {phlebotomist:'Phlebotomist', technologist:'Technologist', pathologist:'Pathologist', lab_manager:'Lab Manager', admin:'Administrator'};
// Which capabilities each role has is editable (Settings → Users → Role Permissions), so this is
// fetched fresh at login rather than fixed in this file — roleCapabilitiesCache is the live copy.
let roleCapabilitiesCache = { roles: [], allCapabilities: [] };
function hasCapability(cap){
  if(!session.user) return false;
  const entry = roleCapabilitiesCache.roles.find(r=>r.role===session.user.role);
  return entry ? entry.capabilities.includes(cap) : false;
}

// `needs` lists capabilities, any one of which makes the section useful to a role; sections without
// it are for everyone. A role is not shown a section it cannot act in.
const NAV_ITEMS = [
  {id:'processflow', label:'Process Flow'},
  {id:'dashboard', label:'Dashboard'},
  {id:'collection', label:'Sample Collection', needs:['collect']},
  {id:'acceptance', label:'Sample Acceptance', needs:['accept']},
  {id:'processing', label:'Result Processing', needs:['process','certify']},
  {id:'reports', label:'Reports'},
  {id:'settings', label:'Settings'},
];
function navItemsForRole(){ return NAV_ITEMS.filter(n=>!n.needs || n.needs.some(hasCapability)); }

const STATUS_META = {
  deselected:{label:'Not Collected (deselected)', cls:'pill-grey'},
  ordered:{label:'Awaiting Collection', cls:'pill-grey'},
  collected:{label:'Sample Collected — Awaiting Acceptance', cls:'pill-amber'},
  rejected:{label:'Sample Rejected', cls:'pill-crimson'},
  awaiting_referral:{label:'Ready — Refer Upward', cls:'pill-purple'},
  awaiting_receipt:{label:'In Transit to Higher-Level Lab', cls:'pill-purple'},
  received:{label:'Received — Awaiting Processing', cls:'pill-amber'},
  processing:{label:'Loaded to Analyser — Processing', cls:'pill-amber'},
  interfaced:{label:'Result In — Awaiting Validation', cls:'pill-amber'},
  completed:{label:'Validated & Certified — Completed', cls:'pill-teal'},
};

/* ============================= SESSION & CACHES ============================= */
let API_BASE = DEFAULT_API_BASE;
let session = { token: null, user: null }; // user: { name, facilityId, facilityName, tier }
let facilitiesCache = [];
let catalogCache = [];
let categoriesCache = [];
let organismsCache = [];
let antibioticsCache = [];
let wardsCache = [];
let state = { activeView: 'dashboard' };
// Kept for this browser tab only, so a refresh does not log the user out. Closing the tab ends it.
function saveSession(){
  try{
    if(session.token) sessionStorage.setItem('atolllis.session', JSON.stringify({token:session.token, user:session.user, activeView:state.activeView}));
    else sessionStorage.removeItem('atolllis.session');
  }catch(e){ /* storage unavailable — the session simply will not survive a refresh */ }
}
function restoreSession(){
  try{
    const saved = JSON.parse(sessionStorage.getItem('atolllis.session')||'null');
    if(saved && saved.token && saved.user){ session = {token:saved.token, user:saved.user}; state.activeView = saved.activeView || 'dashboard'; return true; }
  }catch(e){ /* ignore a damaged entry */ }
  return false;
}

/* ============================= API CLIENT ============================= */
// Typing in a search box or changing a filter re-draws the screen from the answers already
// loaded (renderCached), instead of asking the server again on every keystroke — that is what made
// search crawl on a slow line. Any change sent to the server empties this, so nothing stale is
// shown after an action.
const getCache = new Map();
let renderingFromCache = false;
async function apiRequest(path, opts){
  opts = opts || {};
  const isGet = !opts.method || opts.method==='GET';
  if(isGet && renderingFromCache && getCache.has(path)) return JSON.parse(getCache.get(path));
  const headers = {'Content-Type':'application/json'};
  if(opts.auth!==false && session.token) headers['Authorization'] = 'Bearer ' + session.token;
  let res;
  try{
    res = await fetch(API_BASE + path, { method: opts.method||'GET', headers, body: opts.body? JSON.stringify(opts.body) : undefined });
  }catch(networkErr){
    throw new Error(`Could not reach the backend at ${API_BASE} — is it running? (${networkErr.message})`);
  }
  let data = null;
  try{ data = await res.json(); }catch(e){ /* empty body */ }
  if(!res.ok){
    if(res.status===401 && opts.auth!==false && session.token){
      // The login has run out (or the server restarted): back to the login screen, saying why.
      doLogout();
      throw new Error('Your session has ended — log in again to continue.');
    }
    const err = new Error((data && data.error) || `Request failed (HTTP ${res.status})`);
    err.status = res.status; err.data = data;
    throw err;
  }
  if(isGet) getCache.set(path, JSON.stringify(data)); else getCache.clear();
  return data;
}

function calcAge(dob){
  const d = new Date(dob), n = new Date();
  let a = n.getFullYear()-d.getFullYear();
  const m = n.getMonth()-d.getMonth();
  if(m<0 || (m===0 && n.getDate()<d.getDate())) a--;
  return a;
}
// Age in completed days, months and years on a date. Keep in step with ageParts() in src/utils/domain.js.
function ageParts(dob, at){
  const d = new Date(dob);
  let n = at ? new Date(at) : new Date();
  if(Number.isNaN(n.getTime())) n = new Date();
  if(!dob || Number.isNaN(d.getTime())) return null;
  let months = (n.getFullYear()-d.getFullYear())*12 + (n.getMonth()-d.getMonth());
  if(n.getDate()<d.getDate()) months--;
  const days = Math.floor((Date.UTC(n.getFullYear(),n.getMonth(),n.getDate()) - Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()))/86400000);
  return {D:Math.max(0,days), M:Math.max(0,months), Y:Math.max(0,Math.floor(months/12))};
}
const AGE_UNIT_ORDER = {D:0, M:1, Y:2};
const AGE_UNIT_WORDS = {D:'days', M:'months', Y:'years'};
// Mirrors matchRange() in src/utils/domain.js: each band is in its own unit and includes both
// ends; `at` is the specimen's collection date.
function matchRange(t, patient, at){
  const age = ageParts(patient.dob, at), sex = patient.sex;
  if(!age) return null;
  const unitOf = r => AGE_UNIT_ORDER[r.ageUnit]!==undefined ? r.ageUnit : 'Y';
  const cands = (t.refRanges||[]).filter(r => (r.sex==='Any'||r.sex===sex) && age[unitOf(r)]>=(r.ageMin??0) && age[unitOf(r)]<=(r.ageMax??150));
  if(!cands.length) return null;
  cands.sort((a,b)=> ((a.sex==='Any'?1:0)-(b.sex==='Any'?1:0)) || (AGE_UNIT_ORDER[unitOf(a)]-AGE_UNIT_ORDER[unitOf(b)]));
  return cands[0];
}
// A result as a number, or NaN if it isn't one. "<0.05" / ">400" are read as their boundary.
function numericValue(value){ return parseFloat(String(value??'').trim().replace(/^[<>≤≥]=?\s*/, '')); }
// Mirrors evalResult() in src/utils/domain.js — keep the two in step.
function evalResult(t, patient, value, at){
  if(!t) return {flag:'N/A', flagLabel:'Unknown test', rangeText:''};
  const range = matchRange(t, patient, at);
  const rangeText = range ? `${range.low} – ${range.high} ${t.units||''}`.trim() : 'Not established for age/sex';
  const v = numericValue(value);
  if(Number.isNaN(v)) return {flag:'N/A', flagLabel: range?'':'Not established', rangeText};
  // Critical limits first, independent of any reference range.
  if(t.criticalLow!=null && v<=t.criticalLow) return {flag:'CriticalLow', flagLabel:'CRITICAL LOW', rangeText};
  if(t.criticalHigh!=null && v>=t.criticalHigh) return {flag:'CriticalHigh', flagLabel:'CRITICAL HIGH', rangeText};
  if(!range) return {flag:'N/A', flagLabel:'Not established', rangeText};
  if(v<range.low) return {flag:'Low', flagLabel:'Low', rangeText};
  if(v>range.high) return {flag:'High', flagLabel:'High', rangeText};
  return {flag:'Normal', flagLabel:'Normal', rangeText};
}

function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso); if(Number.isNaN(d.getTime())) return '—'; return d.toLocaleString('en-GB',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}); }
function fmtDob(dob){ if(!dob) return '—'; const d=new Date(dob); if(Number.isNaN(d.getTime())) return String(dob); return d.toLocaleDateString('en-GB',{year:'numeric',month:'short',day:'numeric'}); }
// Age for display: years from 2 upward; months, then days, below that. Keep in step with
// formatAge() in src/utils/domain.js.
function fmtAge(dob){
  const d = new Date(dob), n = new Date();
  if(!dob || Number.isNaN(d.getTime())) return '?';
  let months = (n.getFullYear()-d.getFullYear())*12 + (n.getMonth()-d.getMonth());
  if(n.getDate()<d.getDate()) months--;
  if(months>=24) return Math.floor(months/12)+'y';
  if(months>=1) return months+'m';
  return Math.max(0, Math.floor((n-d)/86400000))+'d';
}

function fmtWait(iso){

}

// Code 128 (code set B) — a real barcode a scanner or an analyser can read. Each entry is one
// symbol as bars (1) and spaces (0); 104 is Start B, 106 is Stop. The check symbol is the weighted
// sum of the values modulo 103.
const CODE128 = '11011001100,11001101100,11001100110,10010011000,10010001100,10001001100,10011001000,10011000100,10001100100,11001001000,11001000100,11000100100,10110011100,10011011100,10011001110,10111001100,10011101100,10011100110,11001110010,11001011100,11001001110,11011100100,11001110100,11101101110,11101001100,11100101100,11100100110,11101100100,11100110100,11100110010,11011011000,11011000110,11000110110,10100011000,10001011000,10001000110,10110001000,10001101000,10001100010,11010001000,11000101000,11000100010,10110111000,10110001110,10001101110,10111011000,10111000110,10001110110,11101110110,11010001110,11000101110,11011101000,11011100010,11011101110,11101011000,11101000110,11100010110,11101101000,11101100010,11100011010,11101111010,11001000010,11110001010,10100110000,10100001100,10010110000,10010000110,10000101100,10000100110,10110010000,10110000100,10011010000,10011000010,10000110100,10000110010,11000010010,11001010000,11110111010,11000010100,10001111010,10100111100,10010111100,10010011110,10111100100,10011110100,10011110010,11110100100,11110010100,11110010010,11011011110,11011110110,11110110110,10101111000,10100011110,10001011110,10111101000,10111100010,11110101000,11110100010,10111011110,10111101110,11101011110,11110101110,11010000100,11010010000,11010011100,1100011101011'.split(',');
function code128Modules(text){
  const values = [104];
  for(const ch of String(text||'')){
    const v = ch.charCodeAt(0) - 32;
    if(v<0 || v>94) return null; // not encodable in set B
    values.push(v);
  }
  const check = values.reduce((sum,v,i)=> sum + v*(i===0?1:i), 0) % 103;
  return [...values, check, 106].map(v=>CODE128[v]).join('');
}
function barcodeSvg(code, h){
  h = h||46;
  const modules = code128Modules(code);
  if(!modules || !code) return `<div class="muted" style="font-size:11px;">No barcode — this number cannot be encoded.</div>`;
  const quiet = 10; // blank margin each side, in modules — scanners need it
  let bars = '', x = quiet;
  for(let i=0;i<modules.length;){
    let run = 1;
    while(i+run<modules.length && modules[i+run]===modules[i]) run++;
    if(modules[i]==='1') bars += `<rect x="${x}" y="0" width="${run}" height="${h}"/>`;
    x += run; i += run;
  }
  return `<svg viewBox="0 0 ${x+quiet} ${h}" width="100%" height="${h}" preserveAspectRatio="none" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg" style="display:block;background:#fff;" role="img" aria-label="Barcode ${escapeHtml(code)}"><g fill="#000">${bars}</g></svg>`;
}

function openSidebar(){ document.getElementById('topbarMain').classList.add('open'); document.getElementById('sidebarOverlay').classList.add('open'); }
function closeSidebar(){ document.getElementById('topbarMain').classList.remove('open'); document.getElementById('sidebarOverlay').classList.remove('open'); }
function goTo(view){ state.activeView = view; saveSession(); render(); closeSidebar(); }
function goToProcessing(tab, statusFilter){ state.activeView = 'processing'; processingTab = tab; processingStatusFilter = statusFilter || ''; analyserScanResult = null; render(); closeSidebar(); }
function goToReports(tab){ state.activeView = 'reports'; reportsTab = tab; render(); closeSidebar(); }
function newMemoFocus(){ state.activeView='collection'; render().then(()=>{ const el=document.getElementById('memoFetchField'); if(el) el.focus(); }); closeSidebar(); }

let renderSeq = 0;
// opts.cached — redraw from data already loaded (search and filter changes).
// opts.quiet  — background refresh: no dimming, and the cursor is left where it is.
async function render(opts){
  opts = opts || {};
  renderShell();
  const c = document.getElementById('content');
  const seq = ++renderSeq;
  if(!c.innerHTML.trim()) c.innerHTML = `<div class="card muted">Loading…</div>`;
  else if(!opts.cached && !opts.quiet) c.classList.add('busy'); // the old screen stays readable while the new one loads
  renderingFromCache = !!opts.cached;
  try{
    let html = '';
    if(state.activeView==='processflow') html = await viewProcessFlow();
    else if(state.activeView==='dashboard') html = await viewDashboard();
    else if(state.activeView==='collection') html = await viewCollectionPage();
    else if(state.activeView==='acceptance') html = await viewAcceptancePage();
    else if(state.activeView==='processing') html = await viewProcessingPage();
    else if(state.activeView==='reports') html = await viewReportsPage();
    else if(state.activeView==='settings') html = await viewSettings();
    if(seq!==renderSeq) return; // a newer draw has started; this one is out of date
    const act = document.activeElement;
    const keep = (opts.cached && act && act.id && c.contains(act)) ? {id:act.id, start:act.selectionStart, end:act.selectionEnd} : null;
    c.innerHTML = html;
    if(keep){
      const el = document.getElementById(keep.id);
      if(el){ el.focus(); try{ el.setSelectionRange(keep.start, keep.end); }catch(e){ /* not a text field */ } }
    }
  }catch(e){
    if(seq!==renderSeq || !session.token) return;
    c.innerHTML = `<div class="card" style="border-color:var(--crimson-bg);"><h2 style="color:var(--crimson);">This screen could not be loaded</h2><p class="muted">${escapeHtml(e.message)}</p><button class="btn btn-sm" onclick="render()">Try again</button></div>`;
  }finally{
    if(seq===renderSeq){ renderingFromCache = false; c.classList.remove('busy'); }
  }
  if(!opts.cached && !opts.quiet) focusPrimaryField();
}
function renderCached(){ return render({cached:true}); }
// Scan-first screens start with the cursor in the scan field; an open specimen starts in its first
// result field. Skipped on phones (it would pop the keyboard up) and while a dialog is open.
function focusPrimaryField(){
  if(window.innerWidth<=860 || document.getElementById('modalRoot').innerHTML.trim() || document.getElementById('confirmRoot').innerHTML.trim()) return;
  const id = state.activeView==='collection' ? 'memoFetchField'
    : state.activeView==='acceptance' ? 'acceptScanField'
    : state.activeView==='processing' && processingTab==='analyser' ? 'procSearch' : null;
  const el = (state.activeView==='processing' && document.querySelector('#content .result-input')) || (id && document.getElementById(id));
  if(el) el.focus();
}
// Worklists refresh by themselves once a minute so new samples, waiting times and overdue critical
// values stay current — but never while someone is typing, has a result half-entered, or has a
// dialog open.
setInterval(()=>{
  if(!session.token || !['dashboard','processflow','acceptance','processing'].includes(state.activeView)) return;
  if(document.getElementById('modalRoot').innerHTML.trim() || document.getElementById('confirmRoot').innerHTML.trim()) return;
  const active = document.activeElement;
  if(active && ['INPUT','TEXTAREA','SELECT'].includes(active.tagName) && (active.value||'').trim()) return;
  if([...document.querySelectorAll('#content .result-input')].some(el=>(el.value||'').trim())) return;
  render({quiet:true});
}, 60000);

// Keyboard and screen-reader access for things built as clickable blocks (tabs, order cards,
// specimen rows): they become focusable and answer Enter/Space; every field label is tied to its
// field. Applied to whatever is drawn, whenever it is drawn.
let fieldIdSeq = 0;
function enhanceAccessibility(root){
  root.querySelectorAll('[onclick]').forEach(el=>{
    if(['BUTTON','A','INPUT','SELECT','TEXTAREA','LABEL'].includes(el.tagName) || el.hasAttribute('tabindex')) return;
    el.setAttribute('tabindex','0'); el.setAttribute('role', el.classList.contains('tab')||el.classList.contains('subtab') ? 'tab' : 'button');
    if(el.classList.contains('active')) el.setAttribute('aria-selected','true');
  });
  root.querySelectorAll('.field').forEach(field=>{
    const label = field.querySelector(':scope > label');
    const input = field.querySelector('input:not([type=checkbox]):not([type=radio]),select,textarea');
    if(!label || !input || label.htmlFor || label.contains(input)) return;
    if(!input.id) input.id = 'fld_' + (++fieldIdSeq);
    label.htmlFor = input.id;
  });
}
document.addEventListener('keydown', e=>{
  if(e.key!=='Enter' && e.key!==' ') return;
  const el = e.target;
  if(el && el.getAttribute && el.hasAttribute('onclick') && ['button','tab'].includes(el.getAttribute('role'))){ e.preventDefault(); el.click(); }
});
window.addEventListener('DOMContentLoaded', ()=>{
  ['content','modalRoot','loginScreen'].forEach(id=>{
    const root = document.getElementById(id);
    new MutationObserver(()=>enhanceAccessibility(root)).observe(root, {childList:true, subtree:true});
  });
});

async function viewProcessFlow(){
  const fid = session.user.facilityId, f = fac(fid);
  const [pendingCollection, referralPending, pendingAcceptance, analyserQ, validationQ, reportable] = await Promise.all([
    api.orders('pending_collection'), api.orders('referral_pending'), api.orders('pending_acceptance'),
    api.orders('analyser_queue'), api.orders('validation_queue'), api.orders('reportable'),
  ]);
  const awaitingCollect = pendingCollection.length;
  const referralPendingCount = referralPending.reduce((n,o)=>n+o.tests.filter(t=>t.status==='awaiting_referral').length,0);
  const awaitingAccept = pendingAcceptance.length;
  const analyserCount = analyserQ.reduce((n,o)=>n+o.tests.filter(t=>t.performingFacilityId===fid && ['received','processing'].includes(t.status)).length,0);
  const validationCount = validationQ.reduce((n,o)=>n+o.tests.filter(t=>t.performingFacilityId===fid && ['received','interfaced'].includes(t.status)).length,0);
  const reportsReady = reportable.filter(o=>o.tests.some(t=>t.status==='completed')).length;

  const steps = [
    {title:'Memo Generation', desc:'Order memo fed from the HIS — or Billing if no HIS is available.', badge:null, action:"newMemoFocus()"},
    {title:'Sample Collection & Referral', desc:'Find by memo number, select tests, collect & print label. Higher-level tests are assigned and sent right here.', badge:awaitingCollect+referralPendingCount, action:"goTo('collection')"},
    {title:'Sample Acceptance', desc:'Read the barcode, then Accept or Reject with a reason — local tests only.', badge:awaitingAccept, action:"goTo('acceptance')"},
    {title:'Analyser Processing', desc:'Load locally-collected samples to the analyser; results interface back automatically.', badge:analyserCount, action:"goToProcessing('analyser')"},
    {title:'Result Validation', desc:'Validate & certify interfaced or manually entered results.', badge:validationCount, action:"goToProcessing('analyser','interfaced')"},
    {title:'Report Issue', desc:'Completed results become a standard laboratory report.', badge:reportsReady, action:"goToReports('samples')"},
  ];
  const track = steps.map((s,i)=>{
    const step = `<div class="flow-step" onclick="${s.action}">
      <div class="flow-num">${i+1}</div>
      <div class="flow-title">${escapeHtml(s.title)}</div>
      <div class="flow-desc">${escapeHtml(s.desc)}</div>
      ${s.badge!==null ? `<div class="flow-badge"><span class="pill ${s.badge>0?'pill-amber':'pill-grey'}">${s.badge} ${s.badge===1?'item':'items'}</span></div>` : ''}
    </div>`;
    const arrow = i<steps.length-1 ? `<div class="flow-arrow">→</div>` : '';
    return step + arrow;
  }).join('');
  return `
    <div class="pagehead"><h1>Process Flow</h1><p>The sample journey at ${escapeHtml(f.name)}, from memo to issued report. Click any step to jump straight to it.</p></div>
    <div class="card"><div class="flow-track">${track}</div></div>
  `;
}

      <p class="muted" style="margin-top:-6px;font-size:12.5px;">At other laboratories. Contact the lab — the result and patient stay with the performing lab until certified.</p>
      ${critical.escalated.map(c=>`<div class="test-row">

      <div class="card kpi"><div class="n">${completedTodayCount}</div><div class="l">Completed today at this lab</div></div>
    </div>
    ${awaitingReferAction || incoming.length ? `<div class="grid grid-2">
      ${awaitingReferAction? `<div class="card"><h2>Action needed</h2><p class="muted" style="margin-top:-6px;font-size:13px;">${awaitingReferAction} order(s) have higher-level tests ready to be referred upward — assign and send from Sample Collection.</p><button class="btn btn-sm" onclick="goTo('collection')">Open Sample Collection →</button></div>`:''}

    </div>`:''}
    ${!anyOrders? `<div class="card empty"><h2>No activity yet</h2><p>Fetch a memo from the HIS to get started, or (if you're an Admin) create a test memo from Sample Collection to try the system out.</p><button class="btn" style="margin-top:8px;" onclick="goTo('collection')">Open Sample Collection →</button></div>`:''}
    <div class="card">
      <h2>The sample-processing pipeline</h2>

              ${o.tests.map(t=>{
                const tc = test(t.code);

  const newlyAddedTests = o.tests.filter(t=>t.status==='ordered');
  const activeSpecimens = (o.specimens||[]).filter(s=>s.status!=='rejected');
  const rows = o.tests.filter(t=>t.status!=='deselected').map(t=>{
    const tc = test(t.code);
    const spec = (o.specimens||[]).find(s=>s.id===t.specimenId);

    return `<tr>

// Client-side mirror of the backend's tier check, just for the "Requires referral" hint here —
// the backend is the actual source of truth for whether a test gets referred at collect time.
function needsReferralClient(tc, f){
  const TIER_RANK_CLIENT = {health_centre:1, atoll:2, regional:3};
  return TIER_RANK_CLIENT[f.tier] < TIER_RANK_CLIENT[tc.minTier];
}

async function saveCreateTestMemo(){
  const memoNumber = (document.getElementById('tm_memoNumber').value||'').trim();
  const source = document.getElementById('tm_source').value;
  const orderedBy = (document.getElementById('tm_orderedBy').value||'').trim();
  const name = (document.getElementById('tm_name').value||'').trim();
  const sex = document.getElementById('tm_sex').value;
  const hospitalNumber = (document.getElementById('tm_hospitalNumber').value||'').trim();
  const idNumber = (document.getElementById('tm_idNumber').value||'').trim();
  const dob = document.getElementById('tm_dob').value;
  const address = (document.getElementById('tm_address').value||'').trim();
  const tests = Array.from(testMemoSelected);

  if(!memoNumber){ showToast('Enter a memo number.'); return; }
  if(!orderedBy){ showToast('Enter the ordering clinician.'); return; }
  if(!name || !dob){ showToast('Patient name and date of birth are required.'); return; }
  if(!tests.length){ showToast('Select at least one test.'); return; }

  await withErrorToast(async ()=>{
    await api.seedHisMemo({
      memoNumber, source, orderedBy,
      patient: { name, idNumber, hospitalNumber, dob, sex, address },
      tests,
    });
    closeModal();
    const el = document.getElementById('memoFetchField');
    if(el){ el.value = memoNumber; el.focus(); }
    showToast(`Memo ${memoNumber} created — press Enter in the Memo Number field to fetch it.`);
  });
}

async function fetchMemo(){
  const el = document.getElementById('memoFetchField');
  const num = (el.value||'').trim();
  if(!num){ showToast('Enter or scan a memo number, Hospital No., or ID No.'); return; }
  memoFetchStatus = 'loading'; memoFetchError = ''; memoSearchMatches = null; await render();
  try{
    const { matches } = await api.searchHis(num);
    if(!matches.length){
      memoFetchStatus = 'error'; memoFetchError = `No memo found in the HIS/Billing system for "${num}".`;
      await render();
      const el2 = document.getElementById('memoFetchField'); if(el2){ el2.value = num; el2.focus(); }
      return;
    }
    if(matches.length===1){
      await loadMemoByNumber(matches[0].memoNumber);
      return;
    }
    memoFetchStatus = null; memoFetchError = '';
    memoSearchMatches = matches;
    await render();
  }catch(e){
    memoFetchStatus = 'error'; memoFetchError = e.message;
    await render();
    const el2 = document.getElementById('memoFetchField'); if(el2){ el2.value = num; el2.focus(); }
  }
}
async function loadMemoByNumber(memoNumber){
  memoFetchStatus = 'loading'; memoFetchError = ''; await render();
  try{
    const order = await api.importMemo(memoNumber);
    memoFetchStatus = null; memoFetchError = ''; memoSearchMatches = null;
    collectionOpenOrderId = order.id; collectionOpenOrder = order;
    await render();
    showToast(order.sampleStatus
      ? `Memo ${order.memoNumber} already collected — showing current status.`
      : `Memo ${order.memoNumber} fetched from ${order.memoSource} — proceed to collect.`);
  }catch(e){
    memoFetchStatus = 'error'; memoFetchError = e.message;
    await render();
  }
}
async function cancelMemo(orderId, btn){
  const name = (btn && btn.dataset && btn.dataset.memo) || itemNameFrom(btn);
  if(!await confirmAction({title:`Cancel this memo?`, body:`Memo <b>${escapeHtml(name||'')}</b> has not been collected. Cancelling removes it from the collection list; it can be fetched again from the HIS if it was cancelled by mistake.`, confirmLabel:`Cancel memo`})) return;
  await withErrorToast(async ()=>{
    await api.cancelMemo(orderId);
    if(collectionOpenOrderId===orderId){ collectionOpenOrderId=null; collectionOpenOrder=null; }
    await render();
    showToast('Memo cancelled.');
  });
}
// Groups selected tests by (Category, Specimen Type) — matching the backend exactly, since that's
// the same key used there to decide how many distinct barcode labels this collection requires.
function slugify(s){ return String(s).replace(/[^a-zA-Z0-9]+/g,'_').replace(/^_+|_+$/g,'') || 'bottle'; }
function openPrintDialog(){
  const selected = Array.from(document.querySelectorAll('input[name="collectTest"]:checked')).map(el=>el.value);
  if(!selected.length){ showToast('Select at least one test to collect. To drop the whole memo, use Cancel Memo.', 'error'); return; }
  if(!document.getElementById('f_idConfirmed')?.checked){ showToast('Confirm the patient\'s identity (tick the box) before collecting.', 'error'); return; }
  const patientType = document.getElementById('f_patientType')?.value || 'outpatient';
  const wardEl = document.getElementById('f_ward');
  const wardId = (patientType==='inpatient' && wardEl) ? wardEl.value : null;
  if(patientType==='inpatient' && !wardId){ showToast('Select a ward for an in-patient.'); return; }
  const statMode = document.getElementById('f_statMode')?.checked || false;
  buildPendingCollect(selected, 'collect');
  pendingCollect.extra = { patientType, wardId, statMode };
  if(!Object.keys(pendingCollect.groups).length){ confirmCollectAndPrint(); return; } // nothing selected — skip straight to collect
  renderPrintDialog();
}
function buildPendingCollect(codes, mode){
  const groups = {}; // "category||bottleType" -> {category, bottleType, tests:[{code,name}]}
  codes.forEach(code=>{
    const tc = test(code);
    const category = (tc && tc.category && tc.category.trim()) ? tc.category.trim() : 'General';
    const bottleType = (tc && tc.specimenType && tc.specimenType.trim()) ? tc.specimenType.trim() : 'Unspecified Specimen';
    const key = `${category}||${bottleType}`;
    const testName = (collectionOpenOrder.tests.find(t=>t.code===code)||{}).name || code;
    (groups[key] = groups[key] || {category, bottleType, tests:[]}).tests.push({code, name: testName});
  });
  pendingCollect = { orderId: collectionOpenOrderId, selectedCodes: codes, groups, mode };
}
// Fixed-width right column (not flex-wrap) so the quantity input always lands in the same place,
// regardless of how long the category/bottle-type heading or specimen number happens to be.
function renderQtyRow(category, bottleType, specimenNumber, testsLine, inputId, qtyLabel){
  return `<div style="display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-top:1px dashed #EAEEF3;">
    <div style="flex:1;min-width:0;">
      <b>${escapeHtml(category)} — ${escapeHtml(bottleType)}</b>
      ${specimenNumber? `<div class="mono muted" style="font-size:11px;margin-top:2px;">${escapeHtml(specimenNumber)}</div>`:''}
      <div class="muted" style="font-size:11px;margin-top:2px;">${testsLine}</div>
    </div>
    <div style="flex:0 0 84px;">
      <label class="muted" style="font-size:11px;display:block;margin-bottom:4px;">${qtyLabel}</label>
      <input type="number" min="0" value="1" id="${inputId}" style="width:100%;">
    </div>
  </div>`;
}
function renderPrintDialog(){
  const { groups, mode } = pendingCollect;
  const isRecollect = mode==='recollect';
  const isCollectAdded = mode==='collect_added';
  const title = isRecollect? 'Recollect & Print' : isCollectAdded? 'Collect Added Test(s)' : 'Print Barcode Labels';
  const subtitle = isRecollect
    ? 'This generates a fresh barcode for the rejected test(s) — the original specimen record stays on file as rejected.'
    : isCollectAdded
      ? 'This generates a barcode for the newly added test(s), which have not been drawn yet.'
      : 'One barcode per Category + Specimen Type combination, based on each test\'s Test Catalog settings.';
  const rows = Object.keys(groups).sort().map(key=>{
    const { category, bottleType, tests } = groups[key];
    const testsLine = tests.map(t=>`${escapeHtml(t.name)} (${escapeHtml(t.code)})`).join(', ');
    return renderQtyRow(category, bottleType, null, testsLine, `qty_${slugify(key)}`, 'Labels to print');
  }).join('');
  document.getElementById('modalRoot').innerHTML = `
  <div class="modal-overlay">
    <div class="modal" style="max-width:480px;">
      <div class="modal-head"><h2>${title}</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
      <p class="muted" style="font-size:12.5px;margin-top:-6px;">${subtitle} Set how many copies of each to print.</p>
      <div class="checklist" style="max-height:none;">${rows}</div>
      <div class="actions-row"><button class="btn btn-teal" onclick="confirmCollectAndPrint()">${title}</button><button class="btn btn-outline" onclick="closeModal()">Cancel</button></div>
    </div>
  </div>`;
}
async function confirmCollectAndPrint(){
  const { orderId, selectedCodes, groups, mode } = pendingCollect;
  const quantities = {};
  Object.keys(groups).forEach(key=>{
    const el = document.getElementById(`qty_${slugify(key)}`);
    quantities[key] = el ? Math.max(0, parseInt(el.value,10)||0) : 1;
  });
  await withErrorToast(async ()=>{
    const usesRecollectEndpoint = mode==='recollect' || mode==='collect_added';
    const order = usesRecollectEndpoint ? await api.recollect(orderId, selectedCodes) : await api.collect(orderId, selectedCodes, pendingCollect.extra);
    collectionOpenOrderId = null; collectionOpenOrder = null;
    await render();
    printLabelsForOrder(order, groups, quantities);
    showToast(usesRecollectEndpoint ? 'Specimen(s) drawn and barcoded.' : `Sample collected — ${order.specimens.length} specimen(s) barcoded.`);
  });
}
// Looks up each group's barcode via the exact specimen a test now belongs to (not by category +
// bottle type alone) — important after a recollect, where an old rejected specimen and a brand new
// one can share the same category/bottle type, and a plain string match would risk grabbing the
// wrong (rejected) barcode.
function printLabelsForOrder(o, groups, quantities){
  const p = o.patient;
  const keys = Object.keys(groups);
  let labelsHtml = '';
  if(!keys.length){
    labelsHtml = `<p class="muted">No tests were selected — nothing to label.</p>`;
  }else{
    keys.sort().forEach(key=>{
      const { category, bottleType, tests } = groups[key];
      const firstTest = tests[0] ? o.tests.find(t=>t.code===tests[0].code) : null;
      const specimen = firstTest ? (o.specimens||[]).find(s=>s.id===firstTest.specimenId) : null;
      const specimenNumber = specimen ? specimen.specimenNumber : '—';
      const qty = quantities[key] ?? 1;
      const codes = tests.map(t=>t.code).join(', ');
      for(let i=0;i<qty;i++) labelsHtml += renderOneLabel(p, specimenNumber, category, bottleType, codes, specimen?.collectedAt);
    });
  }
  document.getElementById('modalRoot').innerHTML = `
  <div class="modal-overlay">
    <div class="modal" style="max-width:420px;">
      <div class="modal-head"><h2>Sample Labels</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
      <div id="labelPrintArea">${labelsHtml}</div>
      <p class="muted no-print" style="font-size:12px;margin-top:10px;">Code 128 barcode. Check the first printed label scans before sticking the rest.</p>
      <div class="actions-row no-print"><button class="btn" onclick="window.print()">Print Labels</button><button class="btn btn-outline" onclick="closeModal()">Close</button></div>
    </div>
  </div>`;
}
function renderOneLabel(p, specimenNumber, category, bottleType, codes, collectedAt){
  return `<div class="print-label" style="border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:10px;background:#fff;color:#000;">
    <div style="font-weight:700;font-size:13.5px;">${escapeHtml(p?.name||'Unknown')}</div>
    <div class="mono" style="font-size:12px;">Hosp. No. ${escapeHtml(p?.hospitalNumber||'—')} · ${p?.dob?`${fmtDob(p.dob)} (${fmtAge(p.dob)})`:'DOB —'} · ${escapeHtml(p?.sex||'—')}</div>
    <div style="font-size:12px;font-weight:600;margin-top:4px;">${escapeHtml(category)} — ${escapeHtml(bottleType)}</div>
    <div style="font-size:11.5px;margin:2px 0 6px;">${escapeHtml(codes)||'—'}</div>
    ${barcodeSvg(specimenNumber)}
    <div class="mono" style="text-align:center;font-size:12.5px;letter-spacing:1px;margin-top:2px;">${escapeHtml(specimenNumber)}</div>
    <div style="font-size:10.5px;text-align:center;margin-top:2px;">Collected ${fmtDate(collectedAt||new Date())}</div>
  </div>`;
}

// Rejection log period — defaults to the last 30 days; both ends are plain YYYY-MM-DD strings.
function localDateStr(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
let rejectionLogTo = localDateStr(new Date());
let rejectionLogFrom = localDateStr(new Date(Date.now() - 29*24*60*60*1000));
function rejectionLogParams(){
  const params = new URLSearchParams();
  if(rejectionLogFrom) params.set('from', new Date(rejectionLogFrom+'T00:00:00').toISOString());
  if(rejectionLogTo) params.set('to', new Date(rejectionLogTo+'T23:59:59.999').toISOString());
  return params.toString();
}

function renderRejectedLog(rejections, f){
  const periodCard = `<div class="card">
    <div class="grid grid-4">
      <div class="field" style="margin-bottom:0;"><label>From</label>
        <input type="date" value="${rejectionLogFrom}" onchange="rejectionLogFrom=this.value;render();"></div>
      <div class="field" style="margin-bottom:0;"><label>To</label>
        <input type="date" value="${rejectionLogTo}" onchange="rejectionLogTo=this.value;render();"></div>
    </div>
  </div>`;
  if(!rejections.length) return periodCard + `<div class="card empty">No rejected specimens in this period.</div>`;

  // Summary: one row per reason, one column per category, counted over the period shown.
  const categories = [...new Set(rejections.map(r=>r.category))].sort();
  const counts = {}; // reasonName -> { category -> n }
  rejections.forEach(r=>{ (counts[r.reasonName] = counts[r.reasonName] || {})[r.category] = (counts[r.reasonName][r.category]||0) + 1; });
  const rowTotal = name => categories.reduce((n,c)=>n+(counts[name][c]||0), 0);
  const reasonNames = Object.keys(counts).sort((x,y)=>rowTotal(y)-rowTotal(x) || x.localeCompare(y));
  const summaryCard = `<div class="card" style="padding:0;overflow-x:auto;">
    <table><thead><tr><th>Reason</th>${categories.map(c=>`<th>${escapeHtml(c)}</th>`).join('')}<th>Total</th></tr></thead>
    <tbody>
      ${reasonNames.map(name=>`<tr><td>${escapeHtml(name)}</td>${categories.map(c=>`<td>${counts[name][c]||'—'}</td>`).join('')}<td><b>${rowTotal(name)}</b></td></tr>`).join('')}
      <tr><td><b>Total</b></td>${categories.map(c=>`<td><b>${rejections.filter(r=>r.category===c).length}</b></td>`).join('')}<td><b>${rejections.length}</b></td></tr>
    </tbody></table>
  </div>`;

  const rows = rejections.map(r=>{
    const elsewhere = r.facilityId !== f.id;           // rejected by a receiving lab, on our specimen
    const notOurs = r.orderingFacilityId !== f.id;     // we rejected it as the receiving lab
    return `<div class="order-card">
      <div class="order-card-head">
        <div><span class="order-id">${escapeHtml(r.specimenNumber)}</span> — ${escapeHtml(r.patient?.name||'Unknown')} <span class="muted">(Hospital No. ${escapeHtml(r.patient?.hospitalNumber||'—')})</span>
          <div class="muted" style="font-size:11.5px;">${escapeHtml(r.category)} · ${escapeHtml(r.bottleType)} · Memo ${escapeHtml(r.memoNumber)}${notOurs?` · Referred from ${escapeHtml(r.orderingFacilityName)}`:''}</div>
          <div class="muted" style="font-size:11.5px;">Rejected ${fmtDate(r.rejectedAt)} by ${escapeHtml(r.rejectedBy||'—')}${elsewhere?` at ${escapeHtml(r.facilityName)} (receiving lab)`:''}</div>
          ${r.note?`<div style="font-size:12.5px;margin-top:4px;">${escapeHtml(r.note)}</div>`:''}
        </div>
        <span class="pill pill-crimson">Rejected: ${escapeHtml(r.reasonName)}</span>
      </div>
    </div>`;
  }).join('');
  return periodCard + summaryCard + rows;
}

      <div class="field"><label>Reason</label>
        <select id="reject_reason" onchange="syncRejectNoteField()">

    </div>
  </div>`;
  syncRejectNoteField();
  document.getElementById('reject_reason').focus();

function syncRejectNoteField(){
  const isOther = document.getElementById('reject_reason').value==='other';

}
async function confirmRejectSpecimen(){
  const reasonId = document.getElementById('reject_reason').value;
  const note = (document.getElementById('reject_note').value||'').trim();
  if(!reasonId){ showToast('Select the reason for rejecting this specimen.'); return; }
  if(reasonId==='other' && !note){ showToast('Enter an explanation for "Other".'); return; }
  await withErrorToast(async ()=>{
    if(rejectModalMode==='referral'){
      await api.rejectReferredSpecimen(rejectModalSpecimenNumber, reasonId, note);

          ${Object.entries(PROCESSING_STATUS_GROUPS).map(([k,g])=>`<option value="${k}" ${processingStatusFilter===k?'selected':''}>${g.label}</option>`).join('')}
        </select></div>
      <div class="field" style="margin-bottom:0;"><label>Collected Date</label>
        <input type="date" value="${processingDateFilter}" onchange="processingDateFilter=this.value;renderCached();"></div>
    </div>
    <hr style="border:none;border-top:1px solid var(--border);margin:14px 0;">
    <div style="display:flex;gap:28px;flex-wrap:wrap;align-items:center;">
      <div style="display:flex;gap:14px;align-items:center;">
        <span class="muted" style="font-size:12.5px;font-weight:600;">Patient Type:</span>
        ${['','outpatient','inpatient'].map(v=>`<label style="display:inline-flex;align-items:center;gap:5px;cursor:pointer;font-size:13px;">
          <input type="radio" name="procPatientType" value="${v}" ${processingPatientTypeFilter===v?'checked':''} onchange="processingPatientTypeFilter='${v}';renderCached();">
          ${v===''?'All':v==='inpatient'?'In-Patient':'Out-Patient'}
        </label>`).join('')}
      </div>
      <label style="display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;font-weight:600;">
        <input type="checkbox" ${processingStatOnly?'checked':''} onchange="processingStatOnly=this.checked;renderCached();"> STAT only
      </label>
    </div>
  </div>`;

  const scanPanel = analyserScanResult ? renderSpecimenScanPanel(analyserScanResult) : '';

  const q = worklistSearch.trim().toLowerCase();
  const anyFilterActive = !!(q || processingCategoryFilter || processingStatusFilter || processingDateFilter || processingPatientTypeFilter || processingStatOnly);
  // With no filter set the list is the work itself: everything accepted here that still needs a
  // result or a validation. Certified work only appears when asked for.
  const ACTION_STATUSES = ['received','processing','interfaced'];
  const shownStatuses = anyFilterActive ? ['received','processing','interfaced','completed'] : ACTION_STATUSES;

  const cards = [];
  orders.forEach(o=>{
    const p = o.patient;
    if(q){
      const specMatch = (o.specimens||[]).some(s=>s.specimenNumber.toLowerCase().includes(q));
      const matchOrder = specMatch || (o.memoNumber||'').toLowerCase().includes(q) || (p?.hospitalNumber||'').toLowerCase().includes(q) || (p?.idNumber||'').toLowerCase().includes(q) || (p?.name||'').toLowerCase().includes(q);
      if(!matchOrder) return;
    }
    if(processingPatientTypeFilter && o.patientType!==processingPatientTypeFilter) return;
    // Only ever show specimens that have been accepted into this facility — a specimen still
    // sitting as 'collected' (awaiting acceptance) belongs to Sample Acceptance, not here.
    const mine = s => o.tests.filter(t=>t.specimenId===s.id && t.performingFacilityId===f.id);
    let specimens = (o.specimens||[]).filter(s => mine(s).some(t=>shownStatuses.includes(t.status)));
    if(processingCategoryFilter) specimens = specimens.filter(s=>s.category===processingCategoryFilter);
    if(processingStatusFilter){
      const group = PROCESSING_STATUS_GROUPS[processingStatusFilter];
      specimens = specimens.filter(s=>mine(s).some(t=>group.testStatuses.includes(t.status)));
    }
    if(processingStatOnly) specimens = specimens.filter(s=>mine(s).some(t=>t.isStat));
    // Date always means "collected on" — a specimen's collection date never changes, regardless
    // of which stage (Received/Processing/Interfaced/Certified) it's currently sitting in.
    if(processingDateFilter) specimens = specimens.filter(s=>s.collectedAt && s.collectedAt.slice(0,10)===processingDateFilter);
    if(!specimens.length) return;

    const info = specimens.map(s=>{
      const stests = mine(s);
      const open = stests.filter(t=>ACTION_STATUSES.includes(t.status));
      const toResult = stests.filter(t=>t.status==='received'||t.status==='processing').length;
      const toValidate = stests.filter(t=>t.status==='interfaced').length;
      // Target turnaround is the shortest of the unfinished tests on the tube, counted from collection.
      const targets = open.map(t=>test(t.code)?.tat).filter(h=>h>0);
      const targetH = targets.length ? Math.min(...targets) : null;
      const late = !!(open.length && targetH && s.collectedAt && (Date.now()-new Date(s.collectedAt)) > targetH*3600000);
      return { s, stat: open.some(t=>t.isStat) || (!open.length && stests.some(t=>t.isStat)), open:open.length, toResult, toValidate, targetH, late };
    }).sort((x,y)=> (y.stat-x.stat) || (new Date(x.s.collectedAt||0)-new Date(y.s.collectedAt||0)));

    const html = `<div class="order-card">
      <div class="order-card-head"><div><span class="order-id">${escapeHtml(o.memoNumber)}</span> — ${escapeHtml(p?.name||'Unknown')} <span class="muted">(Hospital No. ${escapeHtml(p?.hospitalNumber||'—')}${p?.dob?` · ${fmtAge(p.dob)}`:''}${p?.sex?` · ${escapeHtml(p.sex)}`:''})</span>${o.patientType? ` <span class="pill pill-grey" style="font-size:10.5px;">${o.patientType==='inpatient'?'In-Patient'+(o.wardName?' · '+escapeHtml(o.wardName):''):'Out-Patient'}</span>`:''}</div></div>
      ${info.map(i=>{
        const s = i.s;
        const work = [i.toResult?`${i.toResult} to result`:'', i.toValidate?`${i.toValidate} to validate`:''].filter(Boolean).join(' · ') || 'Certified';
        return `<div class="test-row ${i.stat?'stat-row':''}" data-specimen-row="${escapeHtml(s.specimenNumber)}" style="cursor:pointer;" onclick="loadSpecimenPanel('${s.specimenNumber}');">
          <div><b class="mono">${escapeHtml(s.specimenNumber)}</b> <span class="muted">(${escapeHtml(s.category)} · ${escapeHtml(s.bottleType)})</span>${i.stat? ` <span class="pill pill-crimson">STAT</span>`:''}</div>
          <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
            ${i.open && s.collectedAt? `<span class="wait ${i.late?'late':''}">${i.late?'⚠ ':''}Waiting ${fmtWait(s.collectedAt)}${i.late?` — over the ${i.targetH}h target`:''}</span>`:''}
            <span class="pill ${i.open?'pill-amber':'pill-teal'}">${work}</span>
          </div>
        </div>`;
      }).join('')}
    </div>`;
    const openInfo = info.filter(i=>i.open);
    cards.push({ html, stat: openInfo.some(i=>i.stat), late: openInfo.some(i=>i.late),
      oldest: Math.min(...info.map(i=>new Date(i.s.collectedAt||Date.now()).getTime())) });
  });
  // STAT first, then anything over its target, then longest waiting.
  cards.sort((x,y)=> (y.stat-x.stat) || (y.late-x.late) || (x.oldest-y.oldest));
  const rows = cards.map(c=>c.html).join('');
  const heading = `<p class="muted" style="font-size:12.5px;margin:0 0 10px;">${anyFilterActive
    ? `${cards.length} memo${cards.length===1?' matches':'s match'} the filters.`
    : `Everything waiting for a result or a validation at this lab — STAT first, then longest waiting. ${cards.length} memo${cards.length===1?'':'s'}.`}</p>`;

  const emptyState = analyserScanResult ? '' : (anyFilterActive
    ? `<div class="card empty">No specimen matches these filters. Clear a filter, or check the specimen has been accepted at Sample Acceptance.</div>`
    : `<div class="card empty">Nothing is waiting for a result or a validation. Accepted specimens appear here by themselves.</div>`);

  return filterCard + scanPanel + (rows ? heading + rows : emptyState);
}
// Pressing Enter in Search acts like a scan: if it narrows to exactly one specimen, jump straight
// into it — same ergonomics as scanning a barcode, without a separate dedicated field for it.
function searchProcessingEnter(){
  const q = worklistSearch.trim().toLowerCase();
  if(!q) return;
  const matches = [];
  document.querySelectorAll('[data-specimen-row]').forEach(el=>{
    const num = el.getAttribute('data-specimen-row');
    if(num.toLowerCase().includes(q)) matches.push(num);
  });
  if(matches.length===1) loadSpecimenPanel(matches[0]);
}
async function loadSpecimenPanel(specimenNumber){
  await withErrorToast(async ()=>{
    analyserScanResult = await api.getSpecimen(specimenNumber);
    await render();
    const panel = document.getElementById('specimenPanel'); if(panel) panel.scrollIntoView({block:'start', behavior:'smooth'});
  });
}
function flagOf(s, t){
  const tc = test(t.code);
  if(t.status==='completed' && isWithdrawn(t)) return {flag:'N/A', flagLabel:'', rangeText:''};
  return (tc && s.patient) ? evalResult(tc, s.patient, t.value, s.collectedAt) : {flag:'N/A', flagLabel:'', rangeText:''};
}
function renderSpecimenScanPanel(s){
  const anyReceived = s.tests.some(t=>t.status==='received');
  const normalToValidate = s.tests.filter(t=>t.status==='interfaced' && flagOf(s,t).flag==='Normal');
  const right = `<div style="display:flex;gap:10px;align-items:center;"><span class="mono" style="font-size:13px;">${escapeHtml(s.specimenNumber)}</span><button class="btn btn-outline btn-sm" onclick="analyserScanResult=null;render();">Close specimen</button></div>`;
  return `<div class="card" id="specimenPanel">
    ${patientBar(s.patient, {patientType:s.patientType, wardName:s.wardName, right})}
    <div class="muted" style="font-size:12.5px;margin-top:8px;">${escapeHtml(s.category)} · ${escapeHtml(s.bottleType)} · Memo ${escapeHtml(s.memoNumber)}${s.orderedBy?` · Ordered by ${escapeHtml(s.orderedBy)}`:''}${s.collectedAt?` · Collected ${fmtDate(s.collectedAt)}`:''}</div>
    <div class="actions-row" style="margin-top:10px;">
      ${anyReceived && hasCapability('process')? `<button class="btn btn-sm btn-outline" onclick="loadSpecimenToAnalyser('${s.specimenNumber}')">Mark as loaded to analyser</button>`:''}
      ${normalToValidate.length>1 && hasCapability('certify')? `<button class="btn btn-sm" onclick="certifyNormalResults()">Validate ${normalToValidate.length} normal results</button>`:''}
    </div>
    ${s.tests.map(t=>renderProcessingTestRow(s, t)).join('')}
  </div>`;
}
// An analyser that asks the LIS for its orders does this by itself; the button is for instruments
// that are loaded by hand.
async function loadSpecimenToAnalyser(specimenNumber){
  await withErrorToast(async ()=>{
    await api.loadSpecimenAnalyser(specimenNumber);
    analyserScanResult = await api.getSpecimen(specimenNumber);
    await render();

// Handles all four post-acceptance stages in one place — Received / Loaded to Analyser (enter a
// result by hand, or the culture form), Interfaced (validate), Certified (read-only).
function renderProcessingTestRow(s, t){
  const meta = STATUS_META[t.visibleStatus||t.status] || {label:t.status, cls:'pill-grey'};
  const tc = test(t.code);
  const orderId = s.orderId;
  const unit = escapeHtml(t.unit||(tc?tc.units:'')||'');
  const range = (tc && s.patient) ? matchRange(tc, s.patient, s.collectedAt) : null;
  const rangeText = range ? `Reference ${range.low} – ${range.high} ${escapeHtml(tc.units||'')}` : (tc && !tc.isCulture ? 'No reference range for this age and sex' : '');
  const previous = t.previous ? `<div class="muted" style="font-size:12px;">Previous: <span class="mono">${escapeHtml(t.previous.value)} ${escapeHtml(t.previous.unit||'')}</span>, ${fmtDate(t.previous.validatedAt)}</div>` : '';
  let body = `<span class="pill ${meta.cls}">${meta.label}</span>`;
  let under = '';

  if((t.status==='received' || t.status==='processing') && hasCapability('process')){
    if(tc?.isCulture){
      body += ` <button class="btn btn-sm" onclick="openCultureResultModal('${orderId}','${t.code}')">Enter culture result</button>`;
    }else{
      body = `<input class="result-input mono" id="mval_${orderId}_${t.code}" inputmode="decimal" autocomplete="off" style="text-align:right;" aria-label="Result for ${escapeHtml(t.name)}"
          oninput="previewResultFlag(this,'${t.code}')" onkeydown="if(event.key==='Enter'){event.preventDefault();enterManualResult('${orderId}','${t.code}');}">
        <span class="mono muted" style="font-size:12.5px;">${unit}</span>
        <button class="btn btn-sm btn-outline" onclick="enterManualResult('${orderId}','${t.code}')">Save result ↵</button>
        <span class="live-flag" id="mflag_${orderId}_${t.code}"></span>`;
      under = `<div class="muted" style="font-size:12px;">${t.status==='processing'?'Loaded to the analyser — its result arrives here by itself. Enter by hand only if the analyser cannot report it. · ':''}${rangeText}</div>${previous}`;
    }
  }else if(t.status==='interfaced'){
    const info = flagOf(s,t);
    if((t.amendments||[]).length) under += `<div style="font-size:12px;font-weight:600;">Corrected value — the earlier report is being amended. It is released when validated.</div>`;
    body = `<span class="mono" style="font-size:15px;font-weight:600;">${escapeHtml(t.value)} ${unit}</span> <span class="flag-${(info.flag||'').replace(' ','')}">${escapeHtml(info.flagLabel)}</span>
      ${hasCapability('certify')
        ? `<button class="btn btn-sm" onclick="certifyResult('${orderId}','${t.code}')">Validate result</button>`
        : `<span class="muted" style="font-size:12px;">Waiting for a Pathologist or Lab Manager to validate</span>`}`;
    under += `<div class="muted" style="font-size:12px;">${rangeText}${t.enteredBy?` · Entered by ${escapeHtml(t.enteredBy)}, ${fmtDate(t.enteredAt)}`:''}</div>${previous}${amendmentNotes(t)}`;
  }else if(t.status==='completed'){
    const info = flagOf(s,t);
    const amended = (t.amendments||[]).length>0, withdrawn = isWithdrawn(t);
    const canAmend = hasCapability('certify') && t.performingFacilityId===session.user.facilityId && !tc?.isCulture;
    body = `${withdrawn ? `<span style="font-size:15px;font-weight:600;">Result withdrawn</span>` : `<span class="mono" style="font-size:15px;font-weight:600;">${escapeHtml(t.value)} ${unit}</span> <span class="flag-${(info.flag||'').replace(' ','')}">${escapeHtml(info.flagLabel)}</span>`}
      ${amended?`<span class="pill pill-amber">${withdrawn?'Withdrawn':'Amended'}</span>`:''}
      ${canAmend?`<button class="btn btn-sm btn-outline" onclick="openAmendModal('${orderId}','${t.code}')">Amend result</button>`:''}`;
    under = `<div class="muted" style="font-size:12px;">${withdrawn?'':rangeText+' · '}${withdrawn?'Withdrawn':amended?'Amended result validated':'Validated'} by ${escapeHtml(t.validatedBy||'—')}, ${fmtDate(t.validatedAt)}</div>${withdrawn?'':previous}${amendmentNotes(t)}`;
  }

  return `<div class="test-row ${t.isStat?'stat-row':''}"><div><div class="test-name">${escapeHtml(t.name)} <span class="mono muted">(${escapeHtml(t.code)})</span>${t.isStat?` <span class="pill pill-crimson">STAT</span>`:''}</div>${under}</div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">${body}</div></div>`;
}
// Shows what the value means while it is being typed — before it is saved, not after.
function previewResultFlag(input, code){
  const out = document.getElementById(input.id.replace('mval_','mflag_'));
  const s = analyserScanResult, tc = test(code);
  if(!out || !s || !tc) return;
  const value = (input.value||'').trim();
  if(!value){ out.innerHTML = ''; return; }
  const info = evalResult(tc, s.patient, value, s.collectedAt);
  if(Number.isNaN(numericValue(value))){
    const numeric = (tc.refRanges||[]).length || tc.criticalLow!=null || tc.criticalHigh!=null;
    out.innerHTML = numeric ? `<span style="color:var(--amber);font-weight:600;">Not a number — check before saving</span>` : '';
    return;
  }
  out.innerHTML = info.flag==='N/A' ? '' : `<span class="flag-${info.flag}">${escapeHtml(info.flagLabel)}</span>`;
}
async function enterManualResult(orderId, code){
  const val = (document.getElementById(`mval_${orderId}_${code}`).value||'').trim();
  if(val===''){ showToast('Type a result first.'); return; }
  const s = analyserScanResult, tc = test(code);
  const info = (s && tc) ? evalResult(tc, s.patient, val, s.collectedAt) : {flag:'N/A'};
  // A critical value is confirmed before it is saved: a slipped decimal point is the usual cause.
  if(info.flag==='CriticalHigh' || info.flag==='CriticalLow'){
    const t = s.tests.find(x=>x.code===code);
    const ok = await confirmAction({
      title: `${info.flagLabel} — save this result?`,
      body: `<b>${escapeHtml(t?.name||code)}</b> for <b>${escapeHtml(s.patient?.name||'this patient')}</b>: <span class="mono" style="font-size:15px;">${escapeHtml(val)} ${escapeHtml(tc.units||'')}</span>.<br>Check the value. Once saved, the clinician must be notified before it can be validated.`,
      confirmLabel: 'Save critical result',
    });
    if(!ok) return;
  }
  await withErrorToast(async ()=>{
    await api.manualResult(orderId, code, val);
    if(analyserScanResult) analyserScanResult = await api.getSpecimen(analyserScanResult.specimenNumber);
    await render(); // the cursor lands in the next empty result field
    showToast(`Result saved for ${tc?tc.name:code} — waiting for validation.`);
  });
}

/* ---------- Amending a validated result ---------- */
// The first-reported value is never overwritten: the server keeps it with who changed it, when and
// why, and the report says it was amended. Mirrors changesMeaning() in src/utils/amendment.js.
function isWithdrawn(t){ const a = t.amendments||[]; return a.length>0 && a[a.length-1].kind==='withdrawn' && t.value==='Result withdrawn'; }
function amendmentChangesMeaning(action, previousFlag, newFlag){
  if(action==='withdraw') return true;
  if(previousFlag==='N/A' || newFlag==='N/A') return true;
  return previousFlag!==newFlag;
}
function amendmentLine(a){
  const was = `${a.previousValue??''} ${a.previousUnit||''}`.trim() || '—';
  const told = !a.notifyRequired ? '' : a.notifiedAt ? ` Clinician told: ${escapeHtml(a.notifiedTo||'')}, ${fmtDate(a.notifiedAt)}.` : ` <b style="color:var(--crimson);">Clinician not yet told.</b>`;
  return `Previously reported as <span class="mono">${escapeHtml(was)}</span>${a.previousValidatedAt?` on ${fmtDate(a.previousValidatedAt)}`:''}. ${a.kind==='withdrawn'?'Withdrawn':'Amended'} ${fmtDate(a.amendedAt)} by ${escapeHtml(a.amendedBy)}. Reason: ${escapeHtml(a.reason)}.${told}`;
}
function amendmentNotes(t){
  return (t.amendments||[]).map(a=>`<div style="font-size:12px;margin-top:3px;padding-left:8px;border-left:3px solid var(--amber);">${amendmentLine(a)}</div>`).join('');
}

let amendState = null;

    </div>
  </div>`;
  syncAmendModal();
  const v = document.getElementById('amd_value'); if(v) v.focus();

// Works out, as the dialog is filled in, what the new value means and whether someone must be told.
function amendDraft(){
  const st = amendState, s = analyserScanResult, tc = test(st.code);
  const action = (document.querySelector('input[name="amd_action"]:checked')||{}).value || 'correct';
  const value = (document.getElementById('amd_value').value||'').trim();
  const info = action==='correct' && value && tc && s ? evalResult(tc, s.patient, value, s.collectedAt) : {flag:'N/A', flagLabel:''};
  const required = action==='withdraw' || (value!=='' && amendmentChangesMeaning(action, st.previousFlag, info.flag));
  return { action, value, info, required, critical: /^Critical/.test(info.flag||'') };
}

async function saveAmendment(){
  const st = amendState, s = analyserScanResult;
  const t = s.tests.find(x=>x.code===st.code);
  const d = amendDraft();
  const reason = (document.getElementById('amd_reason').value||'').trim();
  if(d.action==='correct' && !d.value){ showToast('Type the corrected value.'); return; }
  if(d.action==='correct' && !st.withdrawn && d.value===String(t.value??'').trim()){ showToast('The corrected value is the same as the reported value.'); return; }
  if(reason.length<5){ showToast('Give the reason for the amendment.'); return; }
  const notification = readNotifyFields();
  if(d.required && !notification){ showToast('Record who was told — or who you tried to reach.'); return; }
  const was = st.withdrawn ? 'Result withdrawn' : `${t.value} ${t.unit||''}`.trim();
  const now = d.action==='withdraw' ? 'Result withdrawn' : `${d.value} ${(test(st.code)||{}).units||''}`.trim();
  const ok = await confirmAction({
    title: d.action==='withdraw' ? 'Withdraw this result?' : 'Amend this result?',
    body: `<b>${escapeHtml(t.name)}</b> for <b>${escapeHtml(s.patient?.name||'this patient')}</b> (Hospital No. ${escapeHtml(s.patient?.hospitalNumber||'—')})<br>

      Reason: ${escapeHtml(reason)}<br><br>The report will be marked as amended and will show the earlier value. This cannot be undone, only amended again.`,
    confirmLabel: d.action==='withdraw' ? 'Withdraw result' : 'Amend result',
  });
  if(!ok) return;
  await withErrorToast(async ()=>{
    const res = await api.amendResult(st.orderId, st.code, { action:d.action, value:d.value, reason, notification });
    closeModal(); amendState = null;
    analyserScanResult = await api.getSpecimen(s.specimenNumber);
    await render();
    if(res.held) showToast('Corrected value saved. It is critical and nobody has been reached yet — notify the clinician under Critical Values, then validate it.', 'error');
    else if(d.required && notification.outcome!=='reached') showToast('Result amended. The clinician has not been told yet — it is listed under Critical Values until someone is.', 'error');
    else showToast(d.action==='withdraw' ? 'Result withdrawn. The report now says so.' : 'Result amended. The report is marked as amended.');
  });
}

// Clicking the chosen letter again clears it. Keys S / I / R set it and move to the next antibiotic;
// Backspace or Delete clears.
function sirPick(group, value){
  const i = Number(group.dataset.org), ab = group.dataset.ab;
  const current = cultureModalState.organisms[i].sensitivities[ab];
  setSensitivity(i, ab, current===value ? '' : value);
  const now = cultureModalState.organisms[i].sensitivities[ab];
  group.querySelectorAll('button').forEach(b=>{ const on = b.textContent===now; b.classList.toggle('on', on); b.setAttribute('aria-checked', on); });
}
function sirKey(e, group){
  const k = e.key.toUpperCase();
  if(['S','I','R'].includes(k)){
    e.preventDefault();
    if(cultureModalState.organisms[Number(group.dataset.org)].sensitivities[group.dataset.ab]!==k) sirPick(group, k);
    const all = [...document.querySelectorAll('#modalRoot .sir')]; const next = all[all.indexOf(group)+1]; if(next) next.focus();
  }else if(e.key==='Backspace' || e.key==='Delete'){
    e.preventDefault();
    const cur = cultureModalState.organisms[Number(group.dataset.org)].sensitivities[group.dataset.ab];
    if(cur) sirPick(group, cur);
  }
}
function setSensitivity(i, antibioticId, value){
  if(value) cultureModalState.organisms[i].sensitivities[antibioticId] = value;
  else delete cultureModalState.organisms[i].sensitivities[antibioticId];
}
