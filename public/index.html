async function certifyResult(orderId, code, skipConfirm){
  const s = analyserScanResult;
  const t = s && s.orderId===orderId ? s.tests.find(x=>x.code===code) : null;
  // A normal result validates in one click. An abnormal one is shown back first, with the last
  // result for comparison — validation cannot be undone from this screen.
  if(t && !skipConfirm){
    const info = flagOf(s,t);
    if(info.flag!=='Normal'){
      const ok = await confirmAction({
        title: 'Validate this result?',
        body: `<b>${escapeHtml(t.name)}</b> for <b>${escapeHtml(s.patient?.name||'this patient')}</b> (Hospital No. ${escapeHtml(s.patient?.hospitalNumber||'—')}):<br>
          <span class="mono" style="font-size:16px;font-weight:600;">${escapeHtml(t.value)} ${escapeHtml(t.unit||'')}</span> ${info.flagLabel?`<span class="flag-${info.flag}">${escapeHtml(info.flagLabel)}</span>`:''}<br>
          <span class="muted">${escapeHtml(info.rangeText||'')}${t.previous?` · Previous ${escapeHtml(t.previous.value)} ${escapeHtml(t.previous.unit||'')}, ${fmtDate(t.previous.validatedAt)}`:' · No previous result on record here'}</span><br>
          It will be released on the report under your name and cannot be changed from this screen.`,
        confirmLabel: 'Validate result', danger:false,
      });
      if(!ok) return;
    }
  }
  await withErrorToast(async ()=>{
    let result;
    try{
      result = await api.certify(orderId, code);
    }catch(e){
      if(e.data && e.data.requiresCriticalNotification){
        // Certification resumes by itself once a successful notification has been recorded.
        openCriticalNotificationModal(orderId, code, e.data.flagLabel, true);
        return;
      }else{
        throw e;
      }
    }
    if(analyserScanResult) analyserScanResult = await api.getSpecimen(analyserScanResult.specimenNumber);
    await render();
    showToast(`Result validated by ${session.user.name} — now on the report.`);

      renderReflexSuggestionModal(orderId, result.reflexSuggestions);

  });

// Validates every NORMAL result on the open specimen in one action. Abnormal and critical results
// are left for individual review, on purpose.
async function certifyNormalResults(){
  const s = analyserScanResult; if(!s) return;
  const normal = s.tests.filter(t=>t.status==='interfaced' && flagOf(s,t).flag==='Normal');
  if(!normal.length) return;
  const ok = await confirmAction({
    title: `Validate ${normal.length} normal results?`,
    body: `For <b>${escapeHtml(s.patient?.name||'this patient')}</b> (Hospital No. ${escapeHtml(s.patient?.hospitalNumber||'—')}), specimen <span class="mono">${escapeHtml(s.specimenNumber)}</span>:<br>
      ${normal.map(t=>`${escapeHtml(t.name)}: <span class="mono">${escapeHtml(t.value)} ${escapeHtml(t.unit||'')}</span>`).join('<br>')}<br>
      <span class="muted">Abnormal and critical results are not included — validate those one by one.</span>`,
    confirmLabel: `Validate ${normal.length} results`, danger:false,
  });
  if(!ok) return;
  let done = 0; const suggestions = [];
  try{
    for(const t of normal){
      const result = await api.certify(s.orderId, t.code);
      done++;
      (result.reflexSuggestions||[]).forEach(x=>suggestions.push(x));
    }
  }catch(e){
    showToast(`${done} of ${normal.length} validated, then stopped: ${e.message}`, 'error');
  }
  analyserScanResult = await api.getSpecimen(s.specimenNumber).catch(()=>analyserScanResult);
  await render();
  if(done===normal.length) showToast(`${done} normal results validated by ${session.user.name}.`);
  if(suggestions.length) renderReflexSuggestionModal(s.orderId, suggestions);
}

  }).join('') : `<div class="card empty">No critical values awaiting notification.</div>`;

  const notified = log.filter(l=>l.notified);
  const onTime = notified.filter(l=>l.onTime).length;
  const logRows = log.map(l=>`<tr>
    <td class="muted" style="font-size:12px;white-space:nowrap;">${fmtDate(l.enteredAt)}</td>
    <td>${escapeHtml(l.patient?.name||'Unknown')}<div class="muted mono" style="font-size:11px;">${escapeHtml(l.memoNumber)}</div></td>
    <td>${escapeHtml(l.name)} <span class="mono muted">(${escapeHtml(l.code)})</span></td>
    <td><span class="mono">${escapeHtml(l.value)} ${escapeHtml(l.unit||'')}</span> <span class="flag-${l.flag||'CriticalHigh'}">${escapeHtml(l.flagLabel)}</span></td>
    <td>${l.notified? `${escapeHtml(l.notifiedTo||'—')}<div class="muted" style="font-size:11px;">${fmtDate(l.notifiedAt)} · ${l.attempts.length} attempt${l.attempts.length===1?'':'s'} logged</div>` : `<span class="muted">Not yet · ${l.attempts.length} attempt${l.attempts.length===1?'':'s'}</span>`}</td>
    <td>${l.notified? `<span class="pill ${l.onTime?'pill-teal':'pill-crimson'}">${l.minutes} min${l.onTime?'':' — late'}</span>` : `<span class="pill pill-amber">${l.minutes} min waiting</span>`}</td>
  </tr>`).join('');

  return `
    <div class="card" style="font-size:12.5px;"><span class="muted">A critical value must be notified within <b>${critical.overdueMinutes} minutes</b> of the result being entered. After that it is marked Overdue for senior staff; after <b>${critical.escalateMinutes} minutes</b> it is also escalated to the Regional administrator. A critical result cannot be certified until someone has been reached.</span></div>
    ${worklist}
    <div class="pagehead" style="margin-top:22px;"><h1 style="font-size:17px;">Critical Value Log</h1></div>
    <div class="card">
      <div class="grid grid-4">
        <div class="field" style="margin-bottom:0;"><label>From</label><input type="date" value="${criticalLogFrom}" onchange="criticalLogFrom=this.value;render();"></div>
        <div class="field" style="margin-bottom:0;"><label>To</label><input type="date" value="${criticalLogTo}" onchange="criticalLogTo=this.value;render();"></div>
      </div>
    </div>
    <div class="grid grid-4">
      <div class="card kpi"><div class="n">${log.length}</div><div class="l">Critical values in period</div></div>
      <div class="card kpi"><div class="n">${onTime}</div><div class="l">Notified within ${critical.overdueMinutes} min</div></div>
      <div class="card kpi"><div class="n">${notified.length - onTime}</div><div class="l">Notified late</div></div>
      <div class="card kpi"><div class="n">${log.length - notified.length}</div><div class="l">Not yet notified</div></div>
    </div>
    <div class="card" style="padding:0;overflow-x:auto;">
      <table><thead><tr><th>Result entered</th><th>Patient</th><th>Test</th><th>Result</th><th>Notified</th><th>Time to notify</th></tr></thead>
      <tbody>${logRows || `<tr><td colspan="6" class="empty">No critical values in this period.</td></tr>`}</tbody></table>
    </div>`;
}
let criticalModalState = null; // { orderId, code, certifyAfter }
let lastCriticalItems = [];
// Everything the caller needs to read out: found in the critical worklist, or on the open specimen.
function criticalContext(orderId, code){
  const c = lastCriticalItems.find(x=>x.orderId===orderId && x.code===code);
  if(c) return { patient:c.patient, name:c.name, value:c.value, unit:c.unit, orderedBy:c.orderedBy, patientType:c.patientType, wardName:c.wardName };
  const s = analyserScanResult;
  const t = s && s.orderId===orderId ? s.tests.find(x=>x.code===code) : null;
  if(t) return { patient:s.patient, name:t.name, value:t.value, unit:t.unit, orderedBy:s.orderedBy, patientType:s.patientType, wardName:s.wardName };
  return null;
}
function openCriticalNotificationModal(orderId, code, flagLabel, certifyAfter){
  criticalModalState = { orderId, code, certifyAfter: !!certifyAfter };
  const ctx = criticalContext(orderId, code);
  const what = ctx ? `
      ${patientBar(ctx.patient, {patientType:ctx.patientType, wardName:ctx.wardName})}
      <div style="border:1.5px solid var(--crimson);border-radius:9px;padding:10px 14px;margin-bottom:12px;">
        <div style="font-size:13px;">${escapeHtml(ctx.name)} <span class="mono muted">(${escapeHtml(code)})</span></div>
        <div style="margin-top:4px;"><span class="mono" style="font-size:20px;font-weight:700;">${escapeHtml(ctx.value)} ${escapeHtml(ctx.unit||'')}</span> <span class="flag-${/LOW/.test(flagLabel||'')?'CriticalLow':'CriticalHigh'}">${escapeHtml(flagLabel||'CRITICAL')}</span></div>
        <div class="muted" style="font-size:12.5px;margin-top:4px;">Ordered by <b>${escapeHtml(ctx.orderedBy||'—')}</b></div>
      </div>` : `<p class="muted" style="font-size:12.5px;">Test <span class="mono">${escapeHtml(code)}</span> — ${escapeHtml(flagLabel||'CRITICAL')}</p>`;
  document.getElementById('modalRoot').innerHTML = `
  <div class="modal-overlay">
    <div class="modal" style="max-width:520px;">
      <div class="modal-head"><h2>Record critical value notification</h2><button class="modal-close" aria-label="Close" onclick="closeModal()">✕</button></div>
      ${what}
      <p class="muted" style="font-size:12.5px;margin-top:0;">Log every attempt — including one that did not get through.${certifyAfter?' The result is validated as soon as someone has been reached.':''}</p>
      <div class="field"><label>Outcome</label>
        <select id="crit_outcome" onchange="syncCriticalModal()">
          <option value="reached">Reached — result given</option>
          <option value="not_reached">Not reached — no answer / unavailable</option>
        </select></div>
      <div class="grid grid-2">
        <div class="field"><label>Person called</label><input id="crit_person" placeholder="Name of the clinician or nurse"></div>
        <div class="field"><label>Their role (optional)</label><input id="crit_role" placeholder="Ordering clinician, ward nurse…"></div>
      </div>
      <div class="field"><label>Method</label>
        <select id="crit_method"><option value="phone">Phone</option><option value="in_person">In person</option></select></div>
      <div class="field" id="crit_readback_wrap"><label style="display:inline-flex;align-items:center;gap:6px;cursor:pointer;"><input type="checkbox" id="crit_readback"> Read-back confirmed — they repeated the result correctly</label></div>
      <div class="field"><label>Note (optional)</label><input id="crit_note"></div>
      <div class="actions-row"><button class="btn btn-danger" onclick="saveCriticalNotification()">Save notification record</button><button class="btn btn-outline" onclick="closeModal()">Cancel</button></div>
    </div>
  </div>`;
  syncCriticalModal();
  const person = document.getElementById('crit_person'); if(person) person.focus();
}
function syncCriticalModal(){
  const reached = document.getElementById('crit_outcome').value==='reached';
  document.getElementById('crit_readback_wrap').style.display = reached ? 'block' : 'none';
}
async function saveCriticalNotification(){
  const st = criticalModalState;
  const outcome = document.getElementById('crit_outcome').value;
  const personName = (document.getElementById('crit_person').value||'').trim();
  if(!personName){ showToast('Enter who was called.'); return; }
  const data = {
    outcome, personName,
    personRole: (document.getElementById('crit_role').value||'').trim(),
    method: document.getElementById('crit_method').value,
    readBack: document.getElementById('crit_readback').checked,
    note: (document.getElementById('crit_note').value||'').trim(),
  };
  await withErrorToast(async ()=>{
    await api.recordCriticalNotification(st.orderId, st.code, data);
    closeModal();
    if(outcome==='reached' && st.certifyAfter){
      await certifyResult(st.orderId, st.code, true); // already reviewed; renders and toasts itself
      return;
    }
    await render();
    showToast(outcome==='reached' ? 'Notification recorded — the result can now be validated.' : 'Attempt logged — still awaiting a successful notification.');
  });
}

let reportSearch = '';
let reportCollectedDateFilter = '';
let reportCategoryFilter = '';
let reportStatusFilter = '';
let reportsTab = 'samples';

async function viewReportsPage(){
  const f = fac(session.user.facilityId);
  return `
    <div class="pagehead"><h1>Reports</h1><p>Standard laboratory reports and patient history for ${escapeHtml(f.name)}.</p></div>
    <div class="tabs">
      <div class="tab ${reportsTab==='samples'?'active':''}" onclick="reportsTab='samples';render();">Sample Reports</div>
      <div class="tab ${reportsTab==='history'?'active':''}" onclick="reportsTab='history';render();">Patient History</div>
    </div>
    ${reportsTab==='samples'? await viewReportsInner() : viewHistoryInner()}
  `;
}
async function viewReportsInner(){
  const q = reportSearch.trim().toLowerCase();
  let orders = await api.orders('report_list');
  if(q) orders = orders.filter(o=>{
    const p = o.patient;
    const specMatch = (o.specimens||[]).some(s=>s.specimenNumber.toLowerCase().includes(q));
    return specMatch || (o.memoNumber||'').toLowerCase().includes(q) || (p?.hospitalNumber||'').toLowerCase().includes(q) || (p?.idNumber||'').toLowerCase().includes(q) || (p?.name||'').toLowerCase().includes(q);
  });
  if(reportCollectedDateFilter) orders = orders.filter(o=>o.collectedAt && o.collectedAt.slice(0,10)===reportCollectedDateFilter);
  if(reportCategoryFilter) orders = orders.filter(o=>o.tests.some(t=>(test(t.code)?.category)===reportCategoryFilter));
  if(reportStatusFilter) orders = orders.filter(o=>{
    const doneCount = o.tests.filter(t=>t.status==='completed').length;
    const collectedCount = o.tests.filter(t=>t.status!=='deselected').length;
    if(reportStatusFilter==='not_completed') return doneCount===0;
    if(reportStatusFilter==='partial') return doneCount>0 && doneCount<collectedCount;
    if(reportStatusFilter==='fully_completed') return collectedCount>0 && doneCount===collectedCount;
    return true;
  });
  const list = orders.map(o=>{
    const p = o.patient;
    const doneCount = o.tests.filter(t=>t.status==='completed').length;
    const collectedCount = o.tests.filter(t=>t.status!=='deselected').length;
    const anyDone = doneCount>0;
    return `<tr>
      <td class="mono">${escapeHtml(o.memoNumber||o.id)}${o.viewerIsOrigin?'':`<div class="muted" style="font-family:inherit;font-size:11px;">Referred from ${escapeHtml(fac(o.orderingFacilityId).name)}</div>`}</td><td>${escapeHtml(p?.name||'?')} <span class="muted">(${escapeHtml(p?.hospitalNumber||'—')})</span></td><td>${fmtDate(o.collectedAt||o.createdAt)}</td>
      <td>${doneCount}/${collectedCount} completed${o.tests.some(t=>t.amended)?` <span class="pill pill-amber">Amended</span>`:''}</td>
      <td>${anyDone? `<button class="btn btn-sm btn-outline" onclick="event.stopPropagation();openReportPdf('${o.id}')">View Report</button>` : `<span class="muted" style="font-size:12px;">Not yet completed</span>`}</td>
    </tr>`;
  }).join('');
  return `
    <div class="card">
      <div class="grid grid-4">
        <div class="field" style="margin-bottom:0;"><label>Search</label>
          <input id="repSearch" value="${escapeHtml(reportSearch)}" placeholder="Patient, Hospital No., ID No., Memo No., or Specimen No."
            oninput="reportSearch=this.value;renderCached();const el=document.getElementById('repSearch');if(el)el.focus();"></div>
        <div class="field" style="margin-bottom:0;"><label>Category</label>
          <select onchange="reportCategoryFilter=this.value;renderCached();">
            <option value="">All categories</option>
            ${categoriesCache.map(c=>`<option value="${escapeHtml(c.name)}" ${reportCategoryFilter===c.name?'selected':''}>${escapeHtml(c.name)}</option>`).join('')}
          </select></div>
        <div class="field" style="margin-bottom:0;"><label>Status</label>
          <select onchange="reportStatusFilter=this.value;renderCached();">
            <option value="">All statuses</option>
            <option value="not_completed" ${reportStatusFilter==='not_completed'?'selected':''}>Not Yet Completed</option>
            <option value="partial" ${reportStatusFilter==='partial'?'selected':''}>Partially Completed</option>
            <option value="fully_completed" ${reportStatusFilter==='fully_completed'?'selected':''}>Fully Completed</option>
          </select></div>
        <div class="field" style="margin-bottom:0;"><label>Collected Date</label>
          <input type="date" value="${reportCollectedDateFilter}" onchange="reportCollectedDateFilter=this.value;renderCached();"></div>
      </div>
      <p class="muted" style="font-size:11px;margin-top:8px;">Collected Date is useful when a walk-in patient knows the date but not their memo number.</p>
    </div>
    <div class="card" style="padding:0;overflow-x:auto;">
      <table><thead><tr><th>Memo No.</th><th>Patient</th><th>Collected</th><th>Status</th><th></th></tr></thead>
      <tbody>${list || `<tr><td colspan="5" class="empty">${q||reportCollectedDateFilter||reportCategoryFilter||reportStatusFilter?'No matching samples.':'No samples found.'}</td></tr>`}</tbody></table>
    </div>
  `;
}
// Opens the report as a PDF in a new browser tab. The PDF is built by the server (one page per
// performing lab); it is fetched here rather than linked so the login token goes in a header.
async function openReportPdf(orderId){
  // The tab has to be opened in the click itself, or the browser treats it as a pop-up.
  const tab = window.open('', '_blank');
  if(!tab){ showToast('The browser blocked the report tab — allow pop-ups for this site.'); return; }
  tab.document.title = 'Laboratory Report';
  tab.document.body.innerHTML = '<p style="font-family:sans-serif;color:#555;padding:24px;">Preparing report…</p>';
  try{
    const res = await fetch(`${API_BASE}/reports/${encodeURIComponent(orderId)}/pdf`, { headers:{ 'Authorization':'Bearer ' + session.token } });
    if(!res.ok){
      let msg = `Could not open the report (HTTP ${res.status})`;
      try{ msg = (await res.json()).error || msg; }catch(e){ /* not JSON */ }
      throw new Error(msg);
    }
    tab.location.replace(URL.createObjectURL(await res.blob()));
  }catch(e){
    tab.close();
    showToast(e.message);
  }
}

let histSearchQuery = '';
function viewHistoryInner(){
  return `
    <div class="card">
      <p class="muted" style="font-size:12.5px;margin-top:0;">Scoped to this facility: its own orders in full, plus only the specific tests that were referred to or from it.</p>
      <div class="field" style="max-width:420px;">
        <label>Search patient by Name, Hospital No., or ID No.</label>
        <input id="histSearch" value="${escapeHtml(histSearchQuery)}" placeholder="Type a name, hospital no., or ID…"
          oninput="histSearchQuery=this.value;clearTimeout(histTimer);histTimer=setTimeout(searchHistory,350);"
          onkeydown="if(event.key==='Enter'){event.preventDefault();clearTimeout(histTimer);searchHistory();}">
      </div>
      <div id="histResults"></div>
    </div>
  `;
}
let histTimer = null, histSeq = 0;
async function searchHistory(){
  const q = histSearchQuery.trim();
  const root = document.getElementById('histResults');
  if(!root) return;
  const seq = ++histSeq;
  if(q.length<2){ root.innerHTML = q ? `<p class="muted">Type at least 2 characters.</p>` : ''; return; }
  root.innerHTML = `<p class="muted">Searching…</p>`;
  let results;
  try{ results = await api.history(q); }
  catch(e){ if(seq===histSeq) root.innerHTML = `<p style="color:var(--crimson);">${escapeHtml(e.message)}</p>`; return; }
  if(seq!==histSeq) return; // a newer search has been typed since
  if(!results.length){ root.innerHTML = `<p class="muted">No patient matches “${escapeHtml(q)}” at this facility. Check the spelling, or search by Hospital No.</p>`; return; }
  root.innerHTML = results.map(({patient:p, orders})=>{
    const entries = orders.map(o=>{
      const rows = o.tests.map(t=>{
        if(t.status){
          return `<div class="test-row"><span>${escapeHtml(t.name)}${t.isStat?` <span class="pill pill-crimson" style="font-size:10px;">STAT</span>`:''}</span><span class="pill ${(STATUS_META[t.status]||{cls:'pill-grey'}).cls}">${(STATUS_META[t.status]||{label:t.status}).label}</span></div>`;
        }
        return `<div class="test-row"><span>${escapeHtml(t.name)}${t.isStat?` <span class="pill pill-crimson" style="font-size:10px;">STAT</span>`:''} <span class="mono muted">(${escapeHtml(t.code)})</span> ${t.specimenNumber?`<span class="mono muted" style="font-size:11px;">${escapeHtml(t.specimenNumber)}</span>`:''}${(t.amendments||[]).length?` <span class="pill pill-amber" style="font-size:10px;">${t.withdrawn?'Withdrawn':'Amended'}</span>`:''}</span>
          <span class="mono flag-${(t.flag||'').replace(' ','')}">${escapeHtml(t.value)} ${escapeHtml(t.unit||'')} ${t.flag && t.flag!=='Normal' && t.flag!=='N/A'?`— ${escapeHtml(t.flagLabel)}`:''}</span></div>
          <div class="muted" style="font-size:12px;margin:-4px 0 6px;">${t.withdrawn?'Withdrawn by':`Ref: ${escapeHtml(t.rangeText||'')} · ${(t.amendments||[]).length?'Amended result certified by':'Certified by'}`} ${escapeHtml(t.validatedBy||'')}, ${fmtDate(t.validatedAt)}</div>${(t.amendments||[]).length?`<div style="margin:-2px 0 8px;">${amendmentNotes(t)}</div>`:''}`;
      }).join('');
      const visitType = o.patientType==='inpatient'? `In-Patient${o.wardName?' · '+escapeHtml(o.wardName):''}` : o.patientType==='outpatient'? 'Out-Patient' : null;
      return `<div class="order-card">
        <div class="order-card-head"><div><span class="order-id">${escapeHtml(o.memoNumber||o.orderId)}</span> <span class="muted">— ${o.own? `ordered here, ${fmtDate(o.createdAt)}` : `referred in, ${fmtDate(o.createdAt)}`}${visitType?` · ${visitType}`:''}</span></div>
        ${!o.own? `<span class="pill pill-purple">Referred tests only</span>`:''}</div>
        ${rows}
      </div>`;
    }).join('');
    return `<div style="margin-top:14px;"><h2>${escapeHtml(p.name)} <span class="mono muted" style="font-weight:400;">(${escapeHtml(p.hospitalNumber||p.id)})</span></h2>
      <p class="muted" style="margin-top:-8px;font-size:12.5px;">Born ${fmtDob(p.dob)} · ${fmtAge(p.dob)} · ${escapeHtml(SEX_LABELS[p.sex]||p.sex||'—')}</p>
      ${entries}</div>`;
  }).join('');
}

// Which tasks each role can perform — Admin only. A capability-based gate wouldn't be safe here,
// since a role could then grant itself more power; this matches the backend's raw role==='admin'
// check rather than hasCapability().
let pendingRoleCaps = null; // { role: Set(capabilities) } while there are unsaved ticks
function roleCapChanges(){
  if(!pendingRoleCaps) return [];
  const out = [];
  roleCapabilitiesCache.roles.forEach(r=>{
    const now = pendingRoleCaps[r.role]; if(!now) return;
    const label = c => (roleCapabilitiesCache.allCapabilities.find(x=>x.capability===c)||{label:c}).label;
    const added = [...now].filter(c=>!r.capabilities.includes(c)), removed = r.capabilities.filter(c=>!now.has(c));
    if(added.length || removed.length) out.push({role:r.role, label:r.label, caps:[...now], added:added.map(label), removed:removed.map(label)});
  });
  return out;
}
async function renderRolePermissions(){
  const data = await api.roleCapabilities();
  roleCapabilitiesCache = data; // keep the live cache in sync with what's shown here
  const has = (r,c) => pendingRoleCaps && pendingRoleCaps[r.role] ? pendingRoleCaps[r.role].has(c) : r.capabilities.includes(c);
  const rows = data.roles.map(r=>`<tr>
    <td style="font-weight:600;">${escapeHtml(r.label)}</td>
    ${data.allCapabilities.map(c=>`<td style="text-align:center;">
      <input type="checkbox" aria-label="${escapeHtml(r.label)} — ${escapeHtml(c.label)}" data-role="${r.role}" data-cap="${c.capability}" ${has(r,c.capability)?'checked':''} onchange="toggleRoleCapability(this)">
    </td>`).join('')}
  </tr>`).join('');
  const changes = roleCapChanges();
  return `
    <div class="card" style="margin-top:20px;">
      <h2>Role permissions</h2>
      <p class="muted" style="font-size:12.5px;margin-top:-6px;">Which tasks each role is allowed to perform. Tick or untick, then save — nothing changes until you do.</p>
      <div style="overflow-x:auto;">
        <table>
          <thead><tr><th>Role</th>${data.allCapabilities.map(c=>`<th style="font-size:11px;">${escapeHtml(c.label)}</th>`).join('')}</tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div class="actions-row" id="roleCapActions">
        <button class="btn" ${changes.length?'':'disabled'} onclick="saveRoleCapabilities()">Save permission changes${changes.length?` (${changes.length} role${changes.length===1?'':'s'})`:''}</button>
        ${changes.length? `<button class="btn btn-outline" onclick="pendingRoleCaps=null;render();">Discard changes</button>`:''}
      </div>
    </div>
  `;
}
function toggleRoleCapability(checkbox){
  const role = checkbox.dataset.role;
  pendingRoleCaps = pendingRoleCaps || {};
  if(!pendingRoleCaps[role]){
    const entry = roleCapabilitiesCache.roles.find(r=>r.role===role);
    pendingRoleCaps[role] = new Set(entry ? entry.capabilities : []);
  }
  if(checkbox.checked) pendingRoleCaps[role].add(checkbox.dataset.cap); else pendingRoleCaps[role].delete(checkbox.dataset.cap);
  const changes = roleCapChanges();
  const row = document.getElementById('roleCapActions');
  if(row) row.innerHTML = `<button class="btn" ${changes.length?'':'disabled'} onclick="saveRoleCapabilities()">Save permission changes${changes.length?` (${changes.length} role${changes.length===1?'':'s'})`:''}</button>
    ${changes.length? `<button class="btn btn-outline" onclick="pendingRoleCaps=null;render();">Discard changes</button>`:''}`;
}
async function saveRoleCapabilities(){
  const changes = roleCapChanges();
  if(!changes.length) return;
  const mine = changes.find(c=>c.role===session.user.role && c.removed.length);
  const ok = await confirmAction({
    title: 'Save these permission changes?',
    body: changes.map(c=>`<b>${escapeHtml(c.label)}</b>: ${[c.added.length?`gains ${c.added.map(escapeHtml).join(', ')}`:'', c.removed.length?`loses ${c.removed.map(escapeHtml).join(', ')}`:''].filter(Boolean).join('; ')}`).join('<br>')
      + `<br><span class="muted">Takes effect at once for everyone with ${changes.length===1?'that role':'those roles'}.</span>`
      + (mine? `<br><b style="color:var(--crimson);">This removes permissions from your own role.</b>`:''),
    confirmLabel: 'Save changes', danger: !!mine,
  });
  if(!ok) return;
  await withErrorToast(async ()=>{
    for(const c of changes) await api.updateRoleCapabilities(c.role, c.caps);
    pendingRoleCaps = null;
    roleCapabilitiesCache = await api.roleCapabilities();
    await render();
    showToast('Role permissions saved.');
  });
}

async function saveInstrumentMap(id){

  });

async function deleteInstrumentMap(id, mapId){
  if(!await confirmAction({title:'Remove this test-code mapping?', body:'The test will no longer be sent to this analyser, and results with this analyser code will be held for review until it is mapped again.', confirmLabel:'Remove mapping'})) return;
  await withErrorToast(async ()=>{ await api.deleteInstrumentMap(id, mapId); await openInstrumentMapsModal(id); });

}
function renderPanelModalBody(){
  const existing = panelModalEditing;

// Bands laid on one line of days to spot holes and overlaps. A month is taken as 30.44 days and a
// year as 365.25, so differences of a few days between units are not reported.
function rangeProblems(ranges){
  const F = {D:1, M:30.4375, Y:365.25}, TOL = 3, END = 150*365.25;
  const out = [];
  const band = r => ({from:(r.ageMin||0)*F[r.ageUnit||'Y'], to:Math.min(END, ((r.ageMax??150)+1)*F[r.ageUnit||'Y']), r});
  const words = r => `${r.ageMin}–${r.ageMax} ${AGE_UNIT_WORDS[r.ageUnit||'Y']}`;
  ranges.forEach(r=>{ if((r.ageMax??150) < (r.ageMin||0)) out.push(`“${words(r)}”: the upper age is below the lower age.`); });
  for(const sex of ['M','F']){
    const label = sex==='M'?'Male':'Female';
    const own = ranges.filter(r=>r.sex===sex), any = ranges.filter(r=>r.sex==='Any');
    // Overlaps are only a problem between bands of the same sex setting (a sex-specific band is meant to override "Any").
    for(const group of [own, sex==='M'?any:[]]){
      const bands = group.map(band).sort((a,b)=>a.from-b.from);
      for(let i=1;i<bands.length;i++) if(bands[i].from < bands[i-1].to - TOL) out.push(`${group===any?'Any sex':label}: “${words(bands[i-1].r)}” and “${words(bands[i].r)}” overlap.`);
    }
    const all = [...own, ...any].map(band).sort((a,b)=>a.from-b.from);
    if(!all.length) continue;
    let covered = 0;
    for(const b of all){
      if(b.from > covered + TOL){ out.push(`${label}: no range between ${fmtAgeDays(covered)} and ${fmtAgeDays(b.from)}.`); }
      covered = Math.max(covered, b.to);
    }
    if(covered < END - TOL) out.push(`${label}: no range from ${fmtAgeDays(covered)} upward.`);
  }
  return [...new Set(out)];
}
function fmtAgeDays(days){
  if(days < 31) return `${Math.round(days)} days`;
  if(days < 730) return `${Math.round(days/30.4375)} months`;
  return `${Math.round(days/365.25)} years`;
}
function rangeWarningsHtml(){
  const filled = draftTest.refRanges.filter(r=>r.low!==''&&r.high!==''&&r.low!=null&&r.high!=null&&!Number.isNaN(r.low)&&!Number.isNaN(r.high));
  const problems = filled.length ? rangeProblems(filled) : [];
  return problems.length ? `<div style="margin-top:6px;padding:8px 10px;border-radius:8px;background:var(--amber-bg);color:var(--amber);font-size:12.5px;"><b>Check the age bands</b> — a gap leaves a patient with no reference range; where bands overlap, the one in the finer unit is used.<ul style="margin:4px 0 0 18px;padding:0;">${problems.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul></div>` : '';
}
function showRangeWarnings(){ const el = document.getElementById('rangeWarnings'); if(el) el.innerHTML = rangeWarningsHtml(); }
function addRangeRow(){ draftTest.refRanges.push({sex:'Any', ageMin:0, ageMax:150, ageUnit:'Y', low:'', high:''}); document.getElementById('rangeTable').innerHTML = rangeRowsHtml(); }
function removeRangeRow(i){ draftTest.refRanges.splice(i,1); document.getElementById('rangeTable').innerHTML = rangeRowsHtml(); }
async function saveTest(){
  const code = document.getElementById('f_code').value.trim().toUpperCase();
  const name = document.getElementById('f_name').value.trim();
  if(!code || !name){ showToast('Test code and name are required.'); return; }
  const isNew = draftTest.code==='';
  const payload = {
    code, name,
    category: document.getElementById('f_category').value.trim() || 'General',
    specimenType: document.getElementById('f_specimen').value.trim(),
    method: document.getElementById('f_method').value.trim(),
    units: document.getElementById('f_units').value.trim(),
    tat: parseFloat(document.getElementById('f_tat').value) || 24,
    minTier: document.getElementById('f_tier').value,
    criticalLow: document.getElementById('f_cl').value===''? null : parseFloat(document.getElementById('f_cl').value),
    criticalHigh: document.getElementById('f_ch').value===''? null : parseFloat(document.getElementById('f_ch').value),
    isCulture: document.getElementById('f_isculture').checked,
    isStat: document.getElementById('f_isstat').checked,
    comment: document.getElementById('f_comment').value,
    refRanges: draftTest.refRanges.filter(r=>r.low!==''&&r.high!==''&&r.low!=null&&r.high!=null),
  };
  await withErrorToast(async ()=>{
    if(isNew) await api.createTest(payload); else await api.updateTest(draftTest.code, payload);
    catalogCache = await api.catalog();
    closeModal(); await render();
    showToast(`Test ${code} saved to catalog.`);
  });
}
async function deleteTest(code, btn){
  const name = itemNameFrom(btn);
  if(!await confirmAction({title:`Delete this test from the catalog?`, body:`Test <b>${escapeHtml(code)}</b> will be deleted from the catalog for every lab. Existing orders and results keep it; new memos with this code will arrive as an unrecognised test.`, confirmLabel:`Delete test`})) return;
  await withErrorToast(async ()=>{
    await api.deleteTest(code);
    catalogCache = await api.catalog();
    await render();
  });
}

/* ---------- Admin — Manage Labs ---------- */
async function viewAdmin(){
  if(!isRegional()){
    return `<div class="card empty">Only the Regional Hospital Laboratory (top-level, hosting) lab has admin rights to manage labs.</div>`;
  }
  const reg = facilitiesCache.find(f=>f.tier==='regional') || {name:'Regional Hospital'};
  const atollRows = facilitiesCache.filter(f=>f.tier==='atoll').map(f=>`<tr>
      <td class="mono">${escapeHtml(f.id)}</td><td>${escapeHtml(f.name)}</td>
      <td><span class="tier-badge ${TIER_CLASS[f.tier]}">${TIER_SHORT[f.tier]}</span></td>
      <td><button class="btn btn-danger btn-sm" onclick="removeFacility('${f.id}',this)">Remove</button></td>
    </tr>`).join('');
  const hcRows = facilitiesCache.filter(f=>f.tier==='health_centre').map(f=>{
    const parent = facilitiesCache.find(x=>x.id===f.parentAtollId);
    return `<tr>
      <td class="mono">${escapeHtml(f.id)}</td><td>${escapeHtml(f.name)}</td>
      <td>${parent? escapeHtml(parent.name) : `${escapeHtml(reg.name)} <span class="muted">(direct — no Atoll Hospital)</span>`}</td>
      <td><button class="btn btn-danger btn-sm" onclick="removeFacility('${f.id}',this)">Remove</button></td>
    </tr>`;
  }).join('');
  return `
    <div class="pagehead" style="display:flex;justify-content:space-between;align-items:center;">
      <div><h1>Admin — Manage Labs</h1><p>This platform is hosted by ${escapeHtml(reg.name)}. Create and manage the Atoll Hospital and Health Centre labs that connect to it.</p></div>
      <button class="btn" onclick="openLabModal()">+ Create Lab</button>
    </div>
    <div class="card" style="padding:0;overflow-x:auto;">
      <h2 style="padding:16px 20px 0;">Atoll Hospital labs</h2>
      <table><thead><tr><th>Lab ID</th><th>Name</th><th>Level</th><th></th></tr></thead>
      <tbody>${atollRows || `<tr><td colspan="4" class="empty">No Atoll Hospital labs created yet.</td></tr>`}</tbody></table>
    </div>
    <div class="card" style="padding:0;overflow-x:auto;">
      <h2 style="padding:16px 20px 0;">Health Centre labs</h2>
      <table><thead><tr><th>Lab ID</th><th>Name</th><th>Parent Atoll Hospital</th><th></th></tr></thead>
      <tbody>${hcRows || `<tr><td colspan="4" class="empty">No Health Centre labs created yet.</td></tr>`}</tbody></table>
    </div>
    <p class="muted" style="font-size:11.5px;">To view a facility's data, grant your own account access to it under Settings → Users → Edit → Facility Access.</p>
  `;
}
function openLabModal(){
  const atolls = facilitiesCache.filter(f=>f.tier==='atoll');
  document.getElementById('modalRoot').innerHTML = `
  <div class="modal-overlay">
    <div class="modal" style="max-width:460px;">
      <div class="modal-head"><h2>Create Lab</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
      <div class="field"><label>Lab Level</label>
        <select id="lab_tier" onchange="document.getElementById('parentField').style.display=this.value==='health_centre'?'block':'none';">
          <option value="atoll">Atoll Hospital</option>
          <option value="health_centre">Health Centre</option>
        </select>
      </div>
      <div class="field"><label>Lab Name</label><input id="lab_name" placeholder="e.g. Dhiffushi Health Centre"></div>
      <div class="field" id="parentField" style="display:none;">
        <label>Parent Atoll Hospital</label>
        ${atolls.length ? `<select id="lab_parent"><option value="">— No Atoll Hospital (refer directly to Regional) —</option>${atolls.map(f=>`<option value="${f.id}">${escapeHtml(f.name)}</option>`).join('')}</select>`
          : `<p class="muted" style="font-size:11.5px;">No Atoll Hospital exists yet — the Regional Hospital will automatically act as the parent lab.</p>`}
      </div>
      <div class="actions-row"><button class="btn" onclick="saveLab()">Create Lab</button><button class="btn btn-outline" onclick="closeModal()">Cancel</button></div>
    </div>
  </div>`;
}
async function saveLab(){
  const name = (document.getElementById('lab_name').value||'').trim();
  const tier = document.getElementById('lab_tier').value;
  if(!name){ showToast('Enter a name for the new lab.'); return; }
  const parentSelect = document.getElementById('lab_parent');
  const parentAtollId = (tier==='health_centre' && parentSelect) ? parentSelect.value : undefined;
  await withErrorToast(async ()=>{
    await api.createFacility({ name, tier, parentAtollId: parentAtollId || undefined });
    facilitiesCache = await api.facilities();
    closeModal(); await render();
    showToast(`${name} created.`);
  });
}
async function removeFacility(id, btn){
  const name = itemNameFrom(btn);
  if(!await confirmAction({title:`Remove this lab?`, body:`<b>${escapeHtml(name||'This lab')}</b> will be removed from the network. Health Centres that referred to it will refer directly to the Regional Hospital.`, confirmLabel:`Remove lab`})) return;
  await withErrorToast(async ()=>{
    const result = await api.deleteFacility(id);
    facilitiesCache = await api.facilities();
    await render();
    showToast(result.reparentedHealthCentres ? `Removed. ${result.reparentedHealthCentres} Health Centre(s) now refer directly to Regional.` : 'Lab removed.');
  });
}

/* ============================= INIT ============================= */
(async function init(){
  if(restoreSession()) await bootstrapCaches(); // a 401 here means the saved login has expired and logs out
  await renderApp();
})();
</script>
